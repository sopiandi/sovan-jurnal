function searchResultsHTML(q){
  q=q.trim().toLowerCase(); if(q.length<2) return "";
  const teams=[...new Set(MATCHES.flatMap(m=>[m.home,m.away]))].filter(t=>t.toLowerCase().includes(q));
  const comps=[...new Set(MATCHES.map(m=>m.comp))].filter(c=>c.toLowerCase().includes(q));
  const players=PLAYERS.filter(p=>p.toLowerCase().includes(q));
  const matches=MATCHES.filter(m=>(m.home+" "+m.away+" "+m.comp).toLowerCase().includes(q));
  // Odds group: live prices from the matching matches (Match result / Match winner).
  // Round 3 (item 1): each price carries its data-odd-key, so the live tick
  // updates it in place — a search result can never go stale while the
  // match page shows the moved price.
  const oddsItems=[];
  matches.slice(0,3).forEach(m=>{
    if(isFT(m)) return; // a finished match has no live prices to show
    if(!m._markets) m._markets=marketsFor(m);
    const mr=(m._markets["Popular"]||[]).find(mk=>mk.label==="Match result"||mk.label==="Match winner");
    if(mr) mr.opts.forEach(op=>oddsItems.push({sel:op.n, odds:op.odds, key:oddKey(m, mr.label, op.n), matchId:m.id, sub:m.home+" v "+m.away+" · "+mr.label}));
  });
  // Markets group: every market label on EVERY match page, with its group
  // and match, so a market result opens that match on the right market tab
  // (and highlights the market). Round 7 (item 14): "BTTS" used to return
  // only the featured match — BTTS exists on every match, so the index
  // covers all of them, and "BTTS" is an alias for "Both teams to score".
  // Round 3 (item 17): index the option names too ("Over 2.5", "Yes") — a
  // search for a market LINE must find it, not just the market name.
  const MARKET_ALIAS = {"Both teams to score":["btts"], "BTTS & total goals 2.5":["btts"], "Both teams to score in 2nd half":["btts"], "2nd half — both teams to score":["btts"], "Match result":["1x2"], "Total goals 2.5":["ou 2.5", "o/u 2.5"]};
  const mkIndex=[];
  // Round 9 (item 11): the same market is listed in two groups (Popular
  // AND Goals — "Both teams to score" and "Total goals 2.5" appear in
  // both), so the index held it twice per match and the 6-result cap cut
  // the list off after 2 matches. Dedupe by (label + match): one entry
  // per market per match, one entry per option per market per match.
  const mkSeen = new Set();
  MATCHES.forEach(mm=>{
    if(mm._void || isFT(mm) || isFinished(mm)) return; // no markets on a closed match
    if(!mm._markets) mm._markets=marketsFor(mm);
    Object.entries(mm._markets).forEach(([g, mkts])=>mkts.forEach(mk=>{
      const mkKey = "M|"+mm.id+"|"+mk.label;
      if(!mkSeen.has(mkKey)){ mkSeen.add(mkKey); mkIndex.push({label:mk.label, group:g, matchId:mm.id, sub:g+" · "+mm.home+" v "+mm.away}); }
      mk.opts.forEach(op=>{
        const opKey = "O|"+mm.id+"|"+mk.label+"|"+op.n;
        if(!mkSeen.has(opKey)){ mkSeen.add(opKey); mkIndex.push({label:op.n, group:g, matchId:mm.id, sub:mk.label+" · "+g+" · "+mm.home+" v "+mm.away}); }
      });
    }));
  });
  const markets=mkIndex.filter(x=>{
    const lbl=(x.label||"").toLowerCase();
    if(lbl.includes(q)) return true;
    const aliases = MARKET_ALIAS[x.label]||[];
    return aliases.some(a=>a.includes(q) || q.includes(a));
  });
  if(!teams.length&&!comps.length&&!players.length&&!markets.length&&!matches.length&&!oddsItems.length)
    return `<div class="search-results"><div class="empty card"><div class="big">🔍</div><h3>No results for “${esc(q)}”</h3><p>Try a team, player, competition or market.</p></div></div>`;
  let h=`<div class="search-results">`;
  if(matches.length){ h+=`<div class="sr-group">Matches</div>`+matches.slice(0,4).map(m=>{ const ko=kickoffInfo(m); return `<button class="sr-item" onclick="go('#/match/${m.id}')"><span class="tag">Match</span><span class="nm">${esc(m.home)} v ${esc(m.away)}</span><span class="meta">${isVoided(m)?"Postponed":isLiveNow(m)?liveMeta(m):isFT(m)?"Full time":isFinished(m)?"Final":ko.past?"Started":esc(m.date)+" "+ko.label} · ${esc(m.comp)}</span></button>`; }).join(""); }
  if(oddsItems.length){ h+=`<div class="sr-group">Odds</div>`+oddsItems.slice(0,6).map(o=>`<button class="sr-item" onclick="goMatch('${o.matchId}')"><span class="tag">Odds</span><span class="nm" data-odd-key="${esc(o.key)}">${esc(o.sel)} @ <span class="vl">${fmt(o.odds)}</span></span><span class="meta">${esc(o.sub)}</span></button>`).join(""); }
  if(teams.length){ h+=`<div class="sr-group">Teams</div>`+teams.slice(0,4).map(t=>{ const tm=firstMatchForTeam(t); return `<button class="sr-item" onclick="go('#/match/${tm?tm.id:MATCHES[0].id}')"><span class="tag">Team</span><span class="nm">${crest(t)} ${esc(t)}</span><span class="meta">${tm?esc(tm.home)+" v "+esc(tm.away)+(tm.status==="live"?" · 🔴 Live":" · "+esc(tm.date)+" "+tm.time):"Follow to add to Favourites"}</span></button>`; }).join(""); }
  if(players.length){ h+=`<div class="sr-group">Players</div>`+players.map(p=>{ const tm=firstMatchForTeam(PLAYER_TEAM[p]||""); return `<button class="sr-item" onclick="go('#/match/${tm?tm.id:MATCHES[0].id}')"><span class="tag">Player</span><span class="nm">${esc(p)}</span><span class="meta">${PLAYER_TEAM[p]?esc(PLAYER_TEAM[p])+" · goalscorer markets":"Goalscorer markets"}</span></button>`; }).join(""); }
  if(comps.length){ h+=`<div class="sr-group">Competitions</div>`+comps.map(c=>`<button class="sr-item" onclick="footComp='${esc(c)}';go('#/football')"><span class="tag">League</span><span class="nm">🏆 ${esc(c)}</span><span class="meta">${MATCHES.filter(m=>m.comp===c).length} matches</span></button>`).join(""); }
  // Round 9 (item 11): a market search returns ALL matches that have the
  // market — the old 6-result cap showed only the first 2 matches for
  // "BTTS" even though 18 have it.
  if(markets.length){ h+=`<div class="sr-group">Markets</div>`+markets.slice(0,80).map(mk=>`<button class="sr-item" onclick="goMatchMarket('${mk.matchId}', '${esc(mk.group)}', '${esc(mk.label)}')"><span class="tag">Market</span><span class="nm">${esc(mk.label)}</span><span class="meta">${esc(mk.sub)}</span></button>`).join(""); }
  return h+`</div>`;
}

function renderSearch(){

// box are two views of the same query — typing in either updates the other.
function setSearchQ(v, fromEl){
  searchQ = v;
  const t = $("#topSearch"), h = $("#homeSearch");
  if(t && t!==fromEl) t.value = v;

/* --- Page 2: Live --- */
function pageLive(){
  // Apply the ?sport= deep link only when the hash actually changed (i.e. on navigation),
  // so the on-page filter chips keep working after arriving via a sport link.
  const hashNow = location.hash;
  if(window._lastLiveHash !== hashNow){
    window._lastLiveHash = hashNow;
    const params=new URLSearchParams(hashNow.split("?")[1]||"");
    const qsSport=params.get("sport");
    // Round 8 (item 7): the data calls the sport "Soccer" — accept the
    // "Football" alias in the URL too, so #/live?sport=Football lists the
    // live football matches instead of none.
    const SPORT_ALIASES = {football:"Soccer", soccer:"Soccer", tennis:"Tennis", basketball:"Basketball"};
    liveFilter.sport = (qsSport && SPORT_ALIASES[qsSport.toLowerCase()]) || qsSport || "All";
    if(qsSport) liveFilter.comp = "All"; // a sport link is a fresh sport view, not a comp-filtered one
  }
  const live=MATCHES.filter(isLiveNow);
  const finished=MATCHES.filter(isFinished); // Round 4: ended matches leave the live list but stay visible as Full time (soccer FT, basketball/tennis Final)
  const filtered=live.filter(m=>(liveFilter.sport==="All"||m.sport===liveFilter.sport)&&(liveFilter.comp==="All"||m.comp===liveFilter.comp));
  // Round 9 (item 13): the FULL TIME section follows the active sport /
  // competition filter too — the old code always showed every finished
  // match, even on a Tennis-only view.
  const finishedFiltered=finished.filter(m=>(liveFilter.sport==="All"||m.sport===liveFilter.sport)&&(liveFilter.comp==="All"||m.comp===liveFilter.comp));
  // Round 5: comp chips list EVERY competition of the selected sport (live
  // + upcoming) — deriving them from live matches only hid competitions
  // with nothing live (Champions League: 5 upcoming, 0 live) and the chip
  // never came back, even after Reset.
  const comps=[...new Set(MATCHES.filter(m=>liveFilter.sport==="All"||m.sport===liveFilter.sport).map(m=>m.comp))];
  let body="";
  if(!filtered.length){
    // Round 5: the Starting-soon fallback must never be an empty list when
    // upcoming matches exist for the sport — relax the comp filter first.
    const soonStrict=MATCHES.filter(m=>m.status==="upcoming"&&(liveFilter.sport==="All"||m.sport===liveFilter.sport)&&(liveFilter.comp==="All"||m.comp===liveFilter.comp)).slice(0,6);
    const soon=soonStrict.length?soonStrict:MATCHES.filter(m=>m.status==="upcoming"&&(liveFilter.sport==="All"||m.sport===liveFilter.sport)).slice(0,6);
    const where = liveFilter.comp!=="All" ? liveFilter.comp : (liveFilter.sport==="All"?"this view":liveFilter.sport);
    body=`<div class="card empty"><div class="big">📺</div><h3>Nothing live in ${esc(where)} — starting soon instead</h3><p>These matches are starting soon instead.</p></div>
    <div class="sec-head"><h2>Starting soon</h2></div>
    <div class="card">${soon.length?soon.map(m=>matchRow(m)).join(""):'<div class="slip-empty">No upcoming matches for this filter.</div>'}</div>`;
  } else {
    const byComp={}; filtered.forEach(m=>{ (byComp[m.comp]=byComp[m.comp]||[]).push(m); });
    body=Object.entries(byComp).map(([c,ms])=>`<div class="group-label">${esc(c)} · ${ms.length} live</div><div class="card">${ms.map(m=>matchRow(m)).join("")}</div>`).join("");
  }
  return `
  <h1>Live now <span class="live-badge">● ${live.length} live</span></h1>
  <p class="muted small" style="margin:6px 0 14px">Every match in play — scores and clocks update live.</p>
  <div class="filters">
    ${["All","Soccer","Tennis","Basketball"].map(s=>`<button class="fchip ${liveFilter.sport===s?"on":""}" onclick="liveFilter.sport='${s}';liveFilter.comp='All';render()">${s==="All"?"All sports":s}</button>`).join("")}
  </div>
  <div class="filters">
    <button class="fchip ${liveFilter.comp==="All"?"on":""}" onclick="liveFilter.comp='All';render()">All competitions</button>
    ${comps.map(c=>`<button class="fchip ${liveFilter.comp===c?"on":""}" onclick="liveFilter.comp='${esc(c)}';render()">${esc(c)}</button>`).join("")}
  </div>
  ${body}
  ${finishedFiltered.length?`<div class="group-label">Full time · ${finishedFiltered.length} finished</div><div class="card">${finishedFiltered.map(m=>matchRow(m)).join("")}</div>`:""}
  <div class="footer-note"><span class="badge-demo">Demo prototype</span> &nbsp;Sample fixtures and odds only.</div>`;
}

/* --- Page 4: Match page --- */
function timelineFor(m){
  // Round 9 (item 15a): the match timeline runs to full time. The static
  // entries (m1: 9', 23', 31', 45', 49') are kept, and the engine's events
  // are appended — goals from the scorers (with the running score), cards
  // from the hash schedule, substitutions at 60' and 75', and half-time /
  // full-time markers. Only events up to the current minute are shown.
  if(m.sport!=="Soccer") return null;
  const started = isStarted(m);
  const min = isLiveNow(m) ? curMin(m) : started ? startedInfo(m).min : (isFT(m) ? 90 : null);
  if(min===null) return TIMELINE[m.id] || null;
  const out = (TIMELINE[m.id] || []).slice();
  const goalMins = new Set(out.filter(e=>e.icon==="⚽").map(e=>e.min));
  const cardMins = new Set(out.filter(e=>e.icon==="🟨").map(e=>e.min));
  const scorers = (started ? startedInfo(m).scorers : (m.scorers || [])).slice().sort((a,b)=>a.min-b.min);
  let rh = 0, ra = 0;
  for(const s of scorers){
    if(s.min > min) break;
    if(teamOfPlayer(s.p)===m.home) rh++; else ra++;
    if(goalMins.has(s.min)) continue;
    out.push({min: s.min, icon:"⚽", text:"Goal — "+s.p+" · "+rh+"–"+ra});
  }
  const scH = SCORERS[m.home]||["Top scorer"], scA = SCORERS[m.away]||["Top scorer"];
  const seedMin = (m._seed && m._seed.minute) || 0;
  for(let k = seedMin+1; k <= min; k++){
    if(hash01(m.id+"|card|"+k) < 0.04 && !cardMins.has(k)){
      const home = hash01(m.id+"|cardt|"+k) < 0.5;
      const list = home ? scH : scA;
      const p = list[Math.floor(hash01(m.id+"|cardp|"+k)*list.length)] || list[0];
      out.push({min: k, icon:"🟨", text:"Yellow card — "+p});
    }
  }
  if(min>=45 && !out.some(e=>e.min===45 && /Half time/.test(e.text))) out.push({min:45, icon:"⏸️", text:"Half time"});
  if(min>=60) out.push({min:60, icon:"🔄", text:"Substitution — "+(scH[1]||scH[0])+" on, "+scH[0]+" off"});
  if(min>=75) out.push({min:75, icon:"🔄", text:"Substitution — "+(scA[1]||scA[0])+" on, "+scA[0]+" off"});
  if(min>=90) out.push({min:90, icon:"🏁", text:"Full time — "+(m.hs||0)+"–"+(m.as||0)});
  out.sort((a,b)=>a.min-b.min);
  return out.length ? out : null;
}
function pageMatch(id){
  // Round 9 (item 15f): an unknown match id is a not-found page, not a
  // silent redirect to the first match — the old code showed Arsenal for
  // any bad id (m23 included).
  const found = MATCHES.find(x=>x.id===id);
  if(!found){
    return `<div class="card" style="padding:20px 16px;margin-top:14px"><h2 style="font-size:18px;font-weight:800">Match not found</h2><p class="muted" style="margin-top:6px">There is no match with the id “${esc(id)}”. It may have been removed, or the link is wrong.</p><p style="margin-top:12px"><a href="#/live" style="color:var(--mint);font-weight:700">‹ Back to Live</a></p></div>`;
  }
  const m=found;
  if(window._lastMatch!==m.id){ matchTab="Popular"; window._lastMatch=m.id; }
  matchId=m.id;
  if(!m._markets) m._markets=marketsFor(m);
  const groups=Object.keys(m._markets);
  if(!groups.includes(matchTab)) matchTab="Popular";
  // A search result (or any goMatch caller) can ask for a specific market group.
  if(window._pendingMatchTab && groups.includes(window._pendingMatchTab)){ matchTab=window._pendingMatchTab; }
  window._pendingMatchTab=null;
  const ft=isFT(m);
  const live=isLiveNow(m);
  const voided=isVoided(m);
  const fin=isFinished(m) && !ft;
  const ko=kickoffInfo(m); // Round 8 (item 5): past kickoff => "Started", like the list
  // Round 9 (item 10): a started match (kickoff passed, still listed as
  // upcoming) runs with a derived clock + score, so minute 1 and minute 80
  // can be told apart — the same derived state that gates its markets.
  const started = isStarted(m);
  const st = started ? startedInfo(m) : null;
  const stFt = started && st && st.ft;
  // The derived clock may say "Full time" (stFt) once a started match has
  // run past 90' in derived time, but the STATUS badge in the comp line
  // below still says "Started · {time} WIB": this is not a live match that
  // ended (nothing settles), and the Round 8 check verifies "Started" on
  // this page. Do not add an stFt branch to the comp line.
  // Scoreboard clock: soccer ticks by the minute; tennis shows the set score
  // plus the live current-set games (ticking); basketball the counting-down
  // quarter clock.
  const clockHTML = voided ? `<span class="clock">Postponed</span>`
    : ft ? `<span class="clock">Full time</span>`
    : fin ? `<span class="clock">Final</span>`
    : stFt ? `<span class="clock">Full time</span>`
    : started ? (m.sport==="Soccer" ? `<span class="clock">Started · ${st.min}′</span>` : `<span class="clock">${esc(ko.startedLabel||"Started")}</span>`)
    : !live ? `<span class="clock">${ko.past ? "Started · " : ""}${esc(m.date||"")}</span>`
    : m.sport==="Tennis" ? `<span class="clock"><span data-tsetscore="${m.id}">${tennisNow(m).sets.map(s=>s[0]+"-"+s[1]).join(", ")||"–"}</span> · <span data-tsets="${m.id}">Set ${tennisNow(m).sets.length+1}</span> <span data-tgames="${m.id}">${tennisNow(m).games[0]}–${tennisNow(m).games[1]}</span></span>`
    : m.sport==="Basketball" ? `<span class="clock"><span data-bb-clock="${m.id}">${bbLabel(m)}</span></span>`
    : `<span class="clock" data-clock-match="${m.id}">${isHT(m)?"45′ Half time":curMin(m)+"′ "+String(soccerSec(m, Date.now())).padStart(2,"0")+"″"}</span>`;
  // Round 7 (item 1): the period label is THE clock's period — 1st half
  // (1–45'), Half time (45' paused), 2nd half (46–90'). It is a live span
  // so refreshClocks() keeps it in step with the clock.
  const halfLabel = (live && m.sport==="Soccer") ? `<span data-period-match="${m.id}">${periodLabel(m)}</span>` : (started && m.sport==="Soccer") ? (st.period==="ht"?"Half time":st.period==="1h"?"1st half":st.period==="2h"?"2nd half":"Full time") : (live ? m.sport : "");
  const mkts=m._markets[matchTab];
  const tl = timelineFor(m);
  // Round 9 (item 9): during half time EVERY odd on the match page is
  // locked — the list already said "odds paused" while the page kept
  // selling Match result.
  const htPaused = live && m.sport==="Soccer" && isHT(m);
  return `
  <div style="margin-bottom:10px"><a href="${m.sport==="Soccer"?"#/football":"#/live"}" style="color:var(--muted);font-size:13px">‹ ${esc(m.comp)}</a></div>
  <div class="scoreboard">
    <div class="comp">${esc(m.comp)}${voided?' · <span class="live-badge" style="background:var(--muted2)">Postponed</span>':ft?' · <span class="live-badge" style="background:var(--muted2)">Full time</span>':fin?' · <span class="live-badge" style="background:var(--muted2)">Final</span>':live?' · <span class="live-badge">Live</span>':started?' · '+esc(ko.startedLabel||"Started"):" · "+esc(m.date)+" "+(ko.past?"Started":ko.label)}</div>
    <div class="clock-row">${clockHTML}<span class="muted small">${halfLabel}</span></div>
    <div class="teams-row">
      <div class="team">${crest(m.home)}<div class="nm">${esc(m.home)}</div></div>
      <div class="score">${(live||ft||fin)?m.hs:(started&&m.sport==="Soccer")?st.hs:"–"}<span>–</span>${(live||ft||fin)?m.as:(started&&m.sport==="Soccer")?st.as:"–"}</div>
      <div class="team">${crest(m.away)}<div class="nm">${esc(m.away)}</div></div>
    </div>
    <div style="margin-top:12px"><button class="starbtn ${follows.teams.includes(m.home)?"on":""}" style="font-size:15px" onclick="toggleFollowTeam('${esc(m.home)}')">${follows.teams.includes(m.home)?"★ Following":"☆ Follow"} ${esc(m.home)}</button></div>
  </div>
  ${live && m.sport==="Soccer" ? `<div class="card" style="padding:10px 14px;margin-bottom:14px"><div class="small" style="font-weight:700">Match stats</div><div class="small muted" style="margin-top:4px">Corners <b data-corners-match="${m.id}">${m.corners||0}</b> · Cards <b data-cards-match="${m.id}">${m.cards||0}</b></div></div>` : ""}
  ${JUDGE_MODE && live && !voided && !ft ? `<div class="card" style="padding:10px 14px;margin-bottom:14px"><button onclick="voidMatch('${m.id}')" style="background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer">🚫 Void this match</button> <span class="small muted">Judge only — voids this match and refunds every open bet on it in full.</span></div>` : ""}
  ${tl?`<div class="card" style="padding:13px 14px;margin-bottom:14px"><h3 style="font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px">Match events</h3>${tl.map(e=>`<div style="display:flex;gap:10px;padding:5px 0;font-size:13px"><span style="flex:0 0 34px;font-weight:800;font-variant-numeric:tabular-nums">${e.min}′</span><span style="flex:0 0 20px">${e.icon}</span><span>${esc(e.text)}</span></div>`).join("")}</div>`:""}
  <div class="var-banner${(varActive && m.id===MATCHES[0].id && !ft)?" show":""}" id="varBanner">📺 VAR check in progress — Match result is suspended until the check clears.</div>
  ${htPaused?`<div class="card" style="padding:13px 14px;margin-bottom:14px"><h3 style="font-size:15px;font-weight:800">Half time — odds paused</h3><p class="muted small" style="margin-top:4px">The break is on — no odds can be placed on this match until the 2nd half starts.</p></div>`:""}
  ${voided?`<div class="card" style="padding:16px 14px;margin-bottom:14px"><h3 style="font-size:15px;font-weight:800">Postponed — this match will not be played</h3><p class="muted small" style="margin-top:4px">The fixture was postponed. No odds are offered, and every open bet on this match settled as Void with the full stake refunded (see My bets → Settled).</p></div>`
  :ft?`<div class="card" style="padding:16px 14px;margin-bottom:14px"><h3 style="font-size:15px;font-weight:800">Full time — ${m.hs}–${m.as}</h3><p class="muted small" style="margin-top:4px">This match has ended. Betting is closed; the markets below are no longer offered.</p></div>`
  :`<div class="mtabs">
    ${groups.map(g=>{
      const susp = m._markets[g].every(mk=>mk.suspended || isSuspended(m,mk.label));
      return `<button class="mtab ${matchTab===g?"on":""} ${susp?"susp-tab":""}" onclick="matchTab='${esc(g)}';render()">${esc(g)} <span class="cnt">(${m._markets[g].length})</span>${susp?'<span class="susp">Suspended</span>':""}</button>`;
    }).join("")}
  </div>
  ${mkts.map(mk=>{
    const susp = mk.suspended || isSuspended(m, mk.label);
    const sk = marketKey(m.id, mk.label);
    const srem = susp ? suspRemaining(sk) : null;
    // Round 7 (item 14): a market opened from a search result is highlighted.
    const hl = window._pendingMarketLabel && mk.label===window._pendingMarketLabel;
    return `<div class="market${hl?" hl":""}" data-mlabel="${esc(mk.label)}"><h3>${esc(mk.label)} ${susp?'<span class="susp-tag">⛔ Suspended</span>':""}</h3>
      <div class="odds-grid ${mk.opts.length===2?"two":""}">
        ${mk.opts.map(op=>oddsBtn(m, mk.label, {...op, suspended:susp || htPaused})).join("")}
      </div>
      ${susp?`<div class="small muted" style="margin-top:6px">This market is suspended — odds are locked while play is stopped. Tapping does nothing.${srem!==null?` Reopens in <span data-susp-count="${sk}">${srem}s</span>. <button onclick="unsuspendMarket('${sk}')" style="background:var(--card3);border:1px solid var(--border2);border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer">Resume now</button>`:""}</div>`:""}
    </div>`;
  }).join("")}`}
  ${(ft||voided)?"":`<div class="card" style="padding:13px 14px;margin-top:6px">
    <div class="small" style="color:var(--muted)">Odds move live — a price flashes <span style="color:var(--green);font-weight:700">green</span> when it shortens and <span style="color:var(--red);font-weight:700">red</span> when it drifts out. If an odd in your slip moves, you must accept the new price before placing.</div>
  </div>`}
  <div class="footer-note"><span class="badge-demo">Demo prototype</span> &nbsp;Sample fixtures and odds only.</div>`;
}

/* --- Page 5: Bet slip + My bets --- */
function pageBets(){
  return `
  <h1>Bet slip &amp; My bets</h1>
  <p class="muted small" style="margin:6px 0 14px">Singles only — every selection is its own bet. Stakes in USDT, decimal odds.</p>
  <div id="betsSlipWrap">

  ${slipHTML()}
  </div>
  <div class="sec-head"><h2>My bets</h2><button class="clearbtn" onclick="resetDemo()">Reset demo data</button></div>
  <div class="bet-tabs">
    <button class="btab ${betTab==="open"?"on":""}" onclick="switchBetTab('open')">Open <span class="n">${myBets.open.length}</span></button>
    <button class="btab ${betTab==="settled"?"on":""}" onclick="switchBetTab('settled')">Settled <span class="n">${myBets.settled.length}</span></button>
  </div>
  ${myBetsHTML(betTab)}
  <details class="demo-tips">
    <summary>💡 Prototype tips — how to see every state</summary>
    <ul>
      ${JUDGE_MODE?`<li><b>Preview every state:</b> use the “PROTOTYPE — PREVIEW EVERY STATE” buttons below the slip — Move live odds, Suspend selection, Fail next bet, Odds changed — they trigger each state on demand.</li>`:`<li><b>States happen live:</b> odds move every few seconds, markets suspend briefly, and a bet can fail — watch the slip and My bets as you play.</li>`}
      <li><b>Odds moving:</b> prices nudge every few seconds and flash green/red — on this page and the match page.</li>
      <li><b>Odds changed:</b> leave a selection in the slip; when its price moves you'll see “Odds changed” and must tap <b>Accept</b> before placing.</li>
      <li><b>Suspended:</b> on the Arsenal match page, the <b>Corners &amp; cards</b> group and <b>Next goal</b> are suspended (locked). Live markets also suspend briefly from time to time — a suspended selection in the slip can't be placed.</li>
      <li><b>Bet failed:</b> try placing with an empty/0 stake, or with a suspended selection in the slip.</li>
      <li><b>Bet placed:</b> add a stake and place — the bet lands in My bets → Open.</li>
      <li><b>Cash out:</b> use Cash out on any open bet — it moves to Settled as “Cashed out”.</li>
    </ul>

  <div class="footer-note"><span class="badge-demo">Demo prototype</span> &nbsp;Sample fixtures and odds only — no real players, no real money, no wallet connection. Built for the Housebets Sportsbook design contest.</div>`;

function switchBetTab(t){ betTab=t; render(); }

/* ================= Router ================= */
function render(){
  const hash=location.hash||"#/home";
  const prevHash=window._prevHash; window._prevHash=hash;
  const [path, query]=hash.replace(/^#\//,"").split("?");
  const seg=path.split("/");
  const route=seg[0]||"home";
  // Round 3 (item 9): the Bets page is the slip — hide the side panel there.
  document.body.classList.toggle("route-bets", route==="bets");
  const view=$("#view");
  // Only close the mobile slip sheet on real navigation — a re-render from a
  // live timer (odds tick, suspension, VAR) must not yank it shut mid-use.
  if(route==="match" && prevHash!==hash) matchTab="Popular"; // fresh navigation to a match page always starts on Popular
  if(route==="live") view.innerHTML=pageLive();
  else if(route==="football") view.innerHTML=pageFootball();
  else if(route==="match") view.innerHTML=pageMatch(seg[1]);
  else if(route==="bets") view.innerHTML=pageBets();
  else view.innerHTML=pageHome();
  // nav active states
  $$("#rail button[data-route], #bottomnav button[data-route]").forEach(b=>{
    b.classList.toggle("on", b.dataset.route===route || (route==="match"&&b.dataset.route==="football"));
  });
  renderSlip();
  // Only jump to the top when the route actually changed; filter/tab clicks keep the scroll position.
  // The mobile slip sheet closes on navigation too — but stays open across same-route re-renders.
  const routeKey = route + (route==="match" ? "/"+(seg[1]||"") : "");
  if(window._lastRouteKey !== routeKey){
    window._lastRouteKey = routeKey; closeSheet();
    // Round 7 (item 14): a search result that asked for a market scrolls it
    // into view instead of the top of the page.
    if(window._pendingMarketLabel){
      const hlEl = document.querySelector(".market.hl");
      if(hlEl) hlEl.scrollIntoView({block:"center"});
      window._pendingMarketLabel = null;
    } else {
      window.scrollTo(0,0);
    }
  }
}
window.addEventListener("hashchange", render);
$("#topSearch").addEventListener("input", e=>{
  const v = e.target.value;
  if(!(location.hash||"").startsWith("#/home")){
    searchQ = v; // pageHome renders with this query once we arrive
    go("#/home");
    // Round 9 (item 11): do NOT move focus to the home search box — the
    // old setTimeout focus-steal fired mid-keystroke and swapped the first
    // letter ("BTTS" came out "TTSB" when typing fast). The home box syncs
    // its value via renderSearch; the user keeps typing where they started.
    setSearchQ(v, e.target);
  } else {
    setSearchQ(v, e.target);
  }
});
render();
