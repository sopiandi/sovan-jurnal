<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Housebets Sportsbook — Prototype</title>
<style>
:root{
  --bg:#070d18; --bg2:#0a1220; --card:#101a2c; --card2:#0d1626; --card3:#131e33;
  --border:#1c2942; --border2:#243450;
  --text:#f2f5fa; --muted:#8b98ad; --muted2:#6b7a90;
  --cyan:#35d3e8; --cyan-dim:#1e7f92; --mint:#b7f6dd; --mint-ink:#06281c;
  --red:#f04452; --red-bg:rgba(240,68,82,.14);
  --green:#2fd47a; --green-bg:rgba(47,212,122,.14);
  --amber:#f5b544; --amber-bg:rgba(245,181,68,.14);
  --odd-bg:#1a2438; --odd-bg2:#202c46; --odd-hover:#263453;
  --radius:12px; --topbar-h:56px; --rail-w:64px; --panel-w:340px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#22314e;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(7,13,24,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(6px)}
.topbar .logo{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.topbar .logo img{height:20px;width:auto;display:block}
.topbar .logo .wave{font-size:22px;line-height:1}
.topsearch{flex:1;max-width:420px;margin-left:8px;display:none}
.topsearch input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px 12px 8px 34px;font-size:14px;outline:none}
.topsearch input:focus{border-color:var(--cyan-dim)}
.topsearch .wrap{position:relative}
.topsearch .wrap::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:13px;opacity:.7}
.prize{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:6px 11px;margin-left:auto;white-space:nowrap}
.prize .t{font-size:10px;color:var(--muted);line-height:1.1}
.prize .v{font-size:13px;font-weight:700;color:#ffd166;line-height:1.1}
.prize .trophy{font-size:16px}
.topbtn{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap}
.btn-login{background:var(--card);border:1px solid var(--border);color:var(--text)}
.btn-reg{background:var(--mint);color:var(--mint-ink)}
.iconbtn{width:38px;height:38px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.walletbtn{display:none;align-items:center;gap:6px;background:var(--mint);color:var(--mint-ink);font-weight:700;padding:8px 14px;border-radius:9px;font-size:14px}
@media(min-width:900px){.topsearch{display:block}.walletbtn{display:flex}}

/* ---------- Layout ---------- */
.shell{display:flex;min-height:calc(100vh - var(--topbar-h))}
.rail{display:none;width:var(--rail-w);flex:0 0 auto;border-right:1px solid var(--border);background:var(--bg2);padding:10px 0;flex-direction:column;align-items:center;gap:4px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h))}
.rail button{width:48px;padding:8px 0 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600}
.rail button .ic{font-size:19px;line-height:1}
.rail button.on{background:var(--card3);color:var(--cyan)}
.rail button:hover{color:var(--text)}
.rail .sep{width:32px;height:1px;background:var(--border);margin:6px 0}
@media(min-width:900px){.rail{display:flex}}
.main{flex:1;min-width:0;padding:14px 14px 120px;max-width:1060px;margin:0 auto;width:100%}
@media(min-width:900px){.main{padding:18px 22px 40px}}
.panel{display:none;width:var(--panel-w);flex:0 0 auto;border-left:1px solid var(--border);background:var(--bg2);padding:16px 14px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto}
@media(min-width:1180px){.panel{display:block}}
/* Round 3 (item 9): the Bets page IS the slip — a visible side panel there
   would duplicate it (two slips, two Place buttons, two My bets lists).
   The panel stays populated in the DOM (tests read it) but is not shown. */
body.route-bets .panel{display:none}

/* ---------- Shared bits ---------- */
h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
h2{font-size:16px;font-weight:700;margin:22px 0 10px}
h2 .sub{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.sec-head h2{margin:0}
.sec-head a{color:var(--cyan);font-size:13px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.clock{font-variant-numeric:tabular-nums;font-weight:700}
.starbtn{color:var(--muted2);font-size:18px;line-height:1;padding:2px}
.starbtn.on{color:#ffd166}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.pill .x{color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
.pill .x:hover{color:var(--red)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan)}

/* odds buttons */
.odds{display:flex;flex-direction:column;gap:2px;background:var(--odd-bg);border:1px solid transparent;border-radius:9px;padding:7px 8px;min-width:0;text-align:left;transition:background .15s,border-color .15s}
.odds:hover{background:var(--odd-hover)}
.odds .lb{font-size:11px;color:#c6d0df;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:normal;word-break:normal}
/* Round 3 (item 14): the follow ★ must be a real, tappable target — 28px
   minimum — not a 2px-padding glyph inside a filter chip. */
.starbtn{min-width:28px;min-height:28px;padding:4px 8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.odds .vl{font-size:15px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1.15}
.odds.sel{background:rgba(53,211,232,.16);border-color:var(--cyan)}
.odds.sel .vl{color:var(--cyan)}
.odds.locked{opacity:.55;cursor:not-allowed}
.odds.locked .vl{color:var(--muted)}
.odds.up .vl{color:var(--green)}
.odds.down .vl{color:var(--red)}
.odds.flash-up{animation:flashUp .9s}
.odds.flash-down{animation:flashDown .9s}
@keyframes flashUp{0%{background:rgba(47,212,122,.45)}100%{background:var(--odd-bg)}}
@keyframes flashDown{0%{background:rgba(240,68,82,.45)}100%{background:var(--odd-bg)}}
.odds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.odds-grid.two{grid-template-columns:repeat(2,1fr)}

/* search */
.searchbar{position:relative;margin:4px 0 12px}
.searchbar input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px 12px 40px;font-size:15px;outline:none}
.searchbar input:focus{border-color:var(--cyan-dim)}
.searchbar::before{content:"🔍";position:absolute;left:13px;top:12px;font-size:15px;opacity:.75}
.search-results{margin-bottom:14px}
.sr-group{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.sr-item:hover{border-color:var(--cyan-dim)}
.sr-item .tag{font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--card3);color:var(--cyan);flex:0 0 auto}
.sr-item .nm{font-weight:600;flex:1;min-width:0;overflow-wrap:normal;word-break:normal}
.sr-item .meta{color:var(--muted);font-size:12px}
/* Round 4: at 390px the long meta (match · market · comp) squeezed the name
   until it truncated ("Over 2.5" cut off) — let the meta drop to its own
   line on narrow screens so the name always shows in full. */
@media(max-width:480px){
  .sr-item{flex-wrap:wrap}
  .sr-item .meta{flex-basis:100%;font-size:11px}
}

/* sports nav chips */
.sportnav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sportnav::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip .ic{font-size:15px}
.chip.on{background:var(--card3);color:var(--text);border-color:var(--border2)}
.chip .live-n{color:var(--red);font-weight:800}
.chip.on .live-n{color:var(--red)}

/* match rows */
.mrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:rgba(255,255,255,.02)}
.mrow .when{flex:0 0 70px;font-size:12px;color:var(--muted);line-height:1.25;white-space:nowrap}
.mrow .when b{display:block;color:var(--text);font-size:13px}
.mrow .teams{flex:1;min-width:0}
.mrow .teams .tm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;overflow-wrap:normal;word-break:normal}
.mrow .teams .tm .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;padding-left:8px}
.mrow .teams .tm+.tm{margin-top:3px}
/* team monogram: 2-3 letter code in a small coloured circle (no real club logos — sample data) */
.mono{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;letter-spacing:.02em;flex:0 0 auto;vertical-align:middle}
.feat .mono{width:24px;height:24px;font-size:10px}
.pill .mono{width:20px;height:20px;font-size:9px}
.sr-item .mono{width:20px;height:20px;font-size:9px}
.mrow .modds{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,92px);gap:6px}
.mrow .mrow-more{color:var(--muted);font-size:12px;white-space:nowrap}
@media(max-width:560px){
  .mrow .mrow-more{display:none}
  .mrow{flex-wrap:wrap;row-gap:9px}
  .mrow .teams{flex:1 1 auto}
  .mrow .modds{flex:1 1 100%;grid-template-columns:repeat(3,1fr)}
  .mrow .modds .odds{padding:8px 10px}
  .mrow .modds .odds .vl{font-size:14px}
}
@media(max-width:420px){.mrow .modds{grid-template-columns:repeat(3,1fr)}}
.mrow .odds{padding:6px 7px}
.mrow .odds .lb{font-size:10px}

/* featured cards */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.feat{padding:14px;cursor:pointer}
.feat:hover{border-color:var(--border2)}
.feat .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.feat .tm{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;padding:3px 0}
.feat .tm .sc{margin-left:auto;font-weight:800;font-size:15px}
.feat .odds-grid{margin-top:11px}

/* market groups */
.mtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mtab.on{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.mtab .susp{font-size:10px;font-weight:800;color:var(--red);text-transform:uppercase;margin-left:4px}
.mtab .cnt{opacity:.65;font-weight:800}
.mtab.susp-tab{border-color:rgba(240,68,82,.5)}
.market{margin-bottom:14px}
.market h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.market h3 .susp-tag{font-size:10px;font-weight:800;color:var(--red);background:var(--red-bg);padding:2px 7px;border-radius:5px;text-transform:uppercase}
.scoreboard{background:linear-gradient(180deg,#12203a,#0d1626);border:1px solid var(--border);border-radius:14px;padding:18px 16px;text-align:center;margin-bottom:14px}
.scoreboard .comp{font-size:12px;color:var(--muted);font-weight:600}
.scoreboard .clock-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px}
.scoreboard .clock-row .clock{font-size:15px}
.scoreboard .teams-row{display:flex;align-items:center;justify-content:center;gap:14px}
@media(max-width:560px){.prize{display:none}}
@media(max-width:480px){.topbar .logo .wave{display:none}}
@media(max-width:420px){.btn-login{display:none}}
.scoreboard .team{flex:1;max-width:220px;min-width:0}
.scoreboard .team .nm{overflow-wrap:normal;word-break:normal}
.scoreboard .score{flex:0 0 auto}
.scoreboard .team .mono{width:52px;height:52px;font-size:15px;margin-bottom:6px}
.scoreboard .team .nm{font-weight:700;font-size:16px}
.scoreboard .score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.scoreboard .score span{color:var(--muted);font-weight:600;margin:0 4px}
.var-banner{display:none;background:var(--amber-bg);border:1px solid rgba(245,181,68,.4);color:var(--amber);font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:12px;text-align:center}
.var-banner.show{display:block}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.fchip.on{background:var(--cyan);color:#04222a;border-color:var(--cyan)}
.empty{padding:26px 16px;text-align:center}
.empty .big{font-size:22px;margin-bottom:8px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:14px}
.group-label{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.group-label:first-child{margin-top:0}

/* bet slip */
.slip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.slip-head h2{margin:0;font-size:16px}
.slip-head .count{background:var(--cyan);color:#04222a;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}
.clearbtn{color:var(--muted);font-size:12px;font-weight:600}
.clearbtn:hover{color:var(--red)}
.slip-empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
.slip-empty .big{font-size:24px;margin-bottom:6px}
.slip-item{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.slip-item.suspended{border-color:rgba(240,68,82,.55)}
.slip-item .sel{font-weight:700;font-size:14px}
.slip-item .mk{color:var(--muted);font-size:12px;margin-top:1px}
.slip-item .oddsrow{display:flex;align-items:center;gap:8px;margin-top:9px;min-width:0}
.slip-item .odds-pill{flex:0 0 auto}
.slip-item .odds-pill{background:var(--odd-bg);border-radius:8px;padding:6px 10px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.slip-item .stake{flex:1;min-width:0;display:flex;align-items:center;background:var(--odd-bg);border-radius:8px;padding:2px 6px 2px 10px;border:1px solid transparent;overflow:hidden}
.slip-item .stake.err{border-color:var(--red)}
.slip-item .stake span{color:var(--muted);font-size:12px;font-weight:700;flex:0 0 auto}
.slip-item .stake input{flex:1;min-width:0;width:100%;box-sizing:border-box;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-weight:700;text-align:right;padding:6px 4px;font-variant-numeric:tabular-nums}
.slip-item .ret{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--muted)}
.slip-item .ret b{color:var(--text);font-variant-numeric:tabular-nums}
.slip-item .chips{display:flex;gap:6px;margin-top:8px}
.slip-item .chip{flex:1;background:var(--odd-bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 0;font-size:12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.slip-item .chip:hover{border-color:var(--cyan-dim)}
.slip-item .chip.on{background:var(--cyan);border-color:var(--cyan);color:#04222a}
.slip-item .chip:disabled{opacity:.4;cursor:default}
.slip-item .rm{color:var(--muted);font-size:16px;padding:2px 6px}
.slip-item .rm:hover{color:var(--red)}
.odds-changed{display:flex;align-items:center;gap:8px;background:var(--amber-bg);border:1px solid rgba(245,181,68,.4);border-radius:8px;padding:7px 10px;margin-top:9px;font-size:12px;font-weight:600;color:var(--amber)}
.odds-changed button{background:var(--amber);color:#241a02;font-weight:800;font-size:12px;border-radius:7px;padding:5px 10px;margin-left:auto}
.susp-note{display:flex;align-items:center;gap:7px;background:var(--red-bg);border:1px solid rgba(240,68,82,.4);border-radius:8px;padding:7px 10px;margin-top:9px;font-size:12px;font-weight:600;color:var(--red)}
.placebar{margin-top:12px}
.placebar .tot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.placebar .tot b{color:var(--text);font-variant-numeric:tabular-nums}
.placebar .bal-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.placebar .bal-line b{color:var(--text);font-variant-numeric:tabular-nums}
.placebar .bal-line .bal-val{color:var(--mint);font-variant-numeric:tabular-nums}
.placebar .bal-line.after{border-top:1px dashed var(--border);padding-top:8px}
.bal-box{margin-bottom:10px}
.bal-box .bal-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.bal-box .bal-line b{color:var(--text);font-variant-numeric:tabular-nums}
.bal-box .bal-line .bal-val{color:var(--mint);font-variant-numeric:tabular-nums}
.placebtn{width:100%;background:var(--mint);color:var(--mint-ink);font-weight:800;font-size:15px;border-radius:11px;padding:13px}
.placebtn:disabled{opacity:.45;cursor:not-allowed}
.placebtn.busy{background:var(--card3);color:var(--muted)}
.slip-err{display:none;background:var(--red-bg);border:1px solid rgba(240,68,82,.45);color:#ff8f98;font-size:13px;font-weight:600;border-radius:9px;padding:9px 11px;margin-top:10px}
.slip-err.show{display:block}
.slip-ok{display:none;background:var(--green-bg);border:1px solid rgba(47,212,122,.45);color:var(--green);font-size:13px;font-weight:700;border-radius:9px;padding:9px 11px;margin-top:10px}
.slip-ok.show{display:block}
.singles-note{text-align:center;color:var(--muted2);font-size:11px;margin-top:9px}

/* my bets */
.bet-tabs{display:flex;gap:6px;margin-bottom:12px}
.btab{flex:1;padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:14px;font-weight:700;color:var(--muted)}
.btab.on{background:var(--card3);color:var(--text);border-color:var(--border2)}
.btab .n{font-size:11px;background:var(--cyan);color:#04222a;border-radius:999px;padding:1px 7px;margin-left:4px}
.bet{padding:13px 14px;margin-bottom:10px}
.bet .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bet .sel{font-weight:700;font-size:14px}
.bet .mk{color:var(--muted);font-size:12px;margin-top:2px}

/* Round 9 (item 3) — LIVE SCORE ENGINE. A live match's score must move

   Basketball: a hash schedule of baskets from game start (see bbEvents).

function hash01(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

  // 'm21|bbt|0'..'9' all landed 0.25-0.31), so the modulo form is the one
  // that is actually uniform.
}
const GOAL_SCHEDULE = {

  // Goals scheduled after the seeded minute, for any live soccer match.

  // as over. The guard is m._finished (set when the game is processed),
  // NOT bbOver(m): when the clock jumps past 00:00 in one step, the final
  // baskets (up to 2880s) must still land before the game is settled —
  // bbOver is already true at 00:00, so guarding on it froze the score

      {label:"To score 2+ goals", type:"2g", opts:gsHome(9.00,2.0).concat(gsAway(17.00,3.0))},
      {label:"Last goalscorer", type:"lgs", opts:gsHome(5.50,2.5).concat(gsAway(11.00,2.0))},
      {label:"To score in 2nd half", type:"2h", opts:gsHome(4.50,1.5).concat(gsAway(9.00,2.0))}

    "Corners & cards": cornersSuspended ? [
      {label:"Total corners", type:"corn", suspended:true, opts:[{n:"Over 9.5",odds:j(1.85)},{n:"Under 9.5",odds:j(1.95)}]},
      {label:"Total corners 10.5", type:"corn", suspended:true, opts:[{n:"Over 10.5",odds:j(2.20)},{n:"Under 10.5",odds:j(1.65)}]},
      {label:"Total cards", type:"cards", suspended:true, opts:[{n:"Over 3.5",odds:j(1.90)},{n:"Under 3.5",odds:j(1.90)}]},
      {label:"First corner", type:"fc", suspended:true, opts:[{n:m.home,odds:j(1.60)},{n:m.away,odds:j(2.30)}]},
      {label:"Next card", type:"nc", suspended:true, opts:[{n:m.home,odds:j(2.10)},{n:m.away,odds:j(2.10)},{n:"No more cards",odds:j(3.50)}]},
      {label:"Total corners 8.5", type:"corn", suspended:true, opts:[{n:"Over 8.5",odds:j(1.55)},{n:"Under 8.5",odds:j(2.40)}]}
    ] : [
      {label:"Total corners", type:"corn", opts:[{n:"Over 9.5",odds:j(1.85)},{n:"Under 9.5",odds:j(1.95)}]},
      {label:"Total corners 10.5", type:"corn", opts:[{n:"Over 10.5",odds:j(2.20)},{n:"Under 10.5",odds:j(1.65)}]},
      {label:"Total cards", type:"cards", opts:[{n:"Over 3.5",odds:j(1.90)},{n:"Under 3.5",odds:j(1.90)}]},
      {label:"First corner", type:"fc", opts:[{n:m.home,odds:j(1.60)},{n:m.away,odds:j(2.30)}]},
      {label:"Next card", type:"nc", opts:[{n:m.home,odds:j(2.10)},{n:m.away,odds:j(2.10)},{n:"No more cards",odds:j(3.50)}]},
      {label:"Total corners 8.5", type:"corn", opts:[{n:"Over 8.5",odds:j(1.55)},{n:"Under 8.5",odds:j(2.40)}]}
    ]
  };
  // Round 9 (item 7): "Next goal" and "Next goalscorer" say nothing until
  // the match has started — on a match whose kickoff is still in the
  // future they must not even appear (the old build showed them
  // SUSPENDED). Once the match has started (live or started) they stay,
  // suspended, until the next goal.
  if(m.status==="upcoming" && !isStarted(m)){
    for(const g of Object.keys(groups)){
      groups[g] = groups[g].filter(mk => mk.label !== "Next goal" && mk.label !== "Next goalscorer");
    }
  }
  // Impossible markets (item 7): a live match past a point in the game can
  // no longer offer a market whose outcome is already decided. Decide from
  // the match's LIVE minute + score + scorers + half-time score — never from
  // the seeded minute alone — so the list follows the clock as the match
  // plays (the 1s interval rebuilds the markets when the live minute
  // crosses 30'/45'). Round 5: the gate covers EVERY group, not just the
  // six time/score labels — a decided SELECTION is removed (e.g. a player
  // who already scored is gone from Anytime goalscorer), and a market whose
  // every option is decided is removed whole. Handicaps are never decided
  // mid-match (any final margin is still mathematically possible) — they
  // close at full time like everything else.
  // Round 9 (items 7, 10) — the impossible-market gate runs for every match
  // that is actually in play: live matches AND started matches (kickoff
  // passed, still listed as upcoming). A started match's minute/score come
  // from its derived state, so "First goal before 30:00" and "First
  // goalscorer" close on it just like on a live match.
  const eff = m.status==="live" ? null : (isStarted(m) ? startedInfo(m) : null);
  const effHT = eff && eff.min >= 45 ? (()=>{
    let hh = 0, aa = 0;
    for(const s of eff.scorers) if(s.half===1){ if(teamOfPlayer(s.p)===m.home) hh++; else aa++; }
    return {hs: hh, as: aa};
  })() : null;
  if(m.status==="live" || eff){
    const min = eff ? eff.min : curMin(m);
    const mhs = eff ? eff.hs : (m.hs || 0), mas = eff ? eff.as : (m.as || 0);
    const goals = mhs + mas;
    const scorers = eff ? eff.scorers : (m.scorers || []);
    const scored = new Set(scorers.map(s=>s.p));
    const goalsOf = p => scorers.filter(s=>s.p===p).length;
    const scored2nd = new Set(scorers.filter(s=>s.half===2).map(s=>s.p));
    const ht = eff ? effHT : ((isFirstHalfOver(m) && m.ht) ? m.ht : null); // half-time score, known once the 1st half is over (incl. during half time)
    const htWin = ht ? (ht.hs>ht.as?"H":ht.hs<ht.as?"A":"D") : null;
    const h2hs = ht ? Math.max(0,mhs-ht.hs) : 0; // 2nd-half goals (home)
    const h2as = ht ? Math.max(0,mas-ht.as) : 0; // 2nd-half goals (away)
    const h2 = h2hs + h2as, htGoals = ht ? ht.hs+ht.as : 0;
    // Round 9 (item 6): the most goals that can still be scored — about
    // one goal every 4 minutes, rounded up — so a total line the match
    // can no longer reach closes instead of being sold.
    const maxAdd = Math.ceil(Math.max(0, 90 - min) / 4);
    const deadLabel = label =>
      // Round 7 (item 1/3): a 1st-half market is decided the moment half
      // time starts — not at 46'. During the half-time pause the 1st half
      // is already over, so the market must be closed (its bets settle).
      (label === "1st half result" && isFirstHalfOver(m)) ||
      (label === "1st half total goals 0.5" && isFirstHalfOver(m)) ||
      (label === "First corner" && min > 45) ||
      (label === "First goal before 30:00" && min > 30) ||
      (label === "Team to score first" && goals > 0) ||
      (label === "First goalscorer" && goals > 0) ||
      // BTTS is decided once both teams have scored (Yes won, No lost).
      (label === "Both teams to score" && mhs>0 && mas>0) ||
      // A "win to nil" is decided once the opponent has scored.
      (label === (m.home+" to win to nil") && mas>0) ||
      // BTTS & total goals 2.5: decided once both scored AND the total passed 2.5.
      (label === "BTTS & total goals 2.5" && mhs>0 && mas>0 && goals>2.5) ||
      // "Both halves — home to win": dead if home did NOT win the 1st half.
      (label === ("Both halves — "+m.home+" to win") && htWin && htWin!=="H") ||
      // "Half with most goals": dead once the 2nd half already has more goals.
      (label === "Half with most goals" && ht && h2 > htGoals) ||
      // 2nd-half BTTS (both spellings): dead once both scored in the 2nd half.
      ((label === "Both teams to score in 2nd half" || label === "2nd half — both teams to score") && h2hs>0 && h2as>0) ||
      // 2nd-half total goals 1.5: dead once the 2nd half already passed 1.5.
      (label === "2nd half total goals 1.5" && h2>1.5);
    // Total-goals lines: once the total passed the line, Over is won and
    // Under is lost — the whole market is decided.
    const ouLine = label => { const mm = label.match(/^Total goals (\d+(?:\.\d+)?)$/); return mm ? parseFloat(mm[1]) : null; };
    for(const g of Object.keys(groups)){
      groups[g] = groups[g].filter(mk=>{
        if(deadLabel(mk.label)) return false;
        const line = ouLine(mk.label);
        // Round 9 (item 6): a total line closes when the total already
        // passed it (Over won) OR when even the maximum still-scoreable
        // goals cannot reach it (Over impossible).
        if(line!==null && (goals>line || goals+maxAdd<line)) return false;
        if(mk.label === (m.home+" total goals") && (mhs>1.5 || mhs+maxAdd<1.5)) return false;
        if(mk.label === (m.away+" total goals") && (mas>0.5 || mas+maxAdd<0.5)) return false;
        // Total corners / cards: decided once the count passed the line.
        if(mk.type==="corn" || mk.type==="cards"){
          let ln = null, cnt = 0;
          if(mk.label==="Total corners"){ ln=9.5; cnt=m.corners||0; }
          else if(mk.label==="Total cards"){ ln=3.5; cnt=m.cards||0; }
          else { const cm = mk.label.match(/(\d+(?:\.\d+)?)$/); if(cm){ ln=parseFloat(cm[1]); cnt = mk.type==="corn" ? (m.corners||0) : (m.cards||0); } }
          if(ln!==null && cnt>ln) return false;
        }
        return true;
      });
    }
    // Option-level gating: a decided SELECTION is removed, the market stays
    // if any live option remains.
    for(const list of Object.values(groups)) for(const mk of list){
      if(mk.label === "Exact score"){
        // A final score must have at least the goals already scored.
        mk.opts = mk.opts.filter(op=>{ const p=op.n.split("-"); return (+p[0])>=mhs && (+p[1])>=mas; });
        // Round 7 (item 7): the score currently on the board must always be
        // offered, and every Exact-score price is repriced off the score +
        // minute (a 3-0 at 71' is not 15.47 for 3-1 — the Poisson model
        // prices each final score off the goals still to come).
        const cur = mhs+"-"+mas;
        if(!mk.opts.some(op=>op.n===cur)) mk.opts.push({n:cur, odds:exactScorePrice(m, mhs, mas)});
        mk.opts.forEach(op=>{ const p=op.n.split("-"); op.odds = exactScorePrice(m, +p[0], +p[1]); });
        mk.opts.sort((a,b)=>{ const pa=a.n.split("-"), pb=b.n.split("-"); return (+pa[0]-+pb[0]) || (+pa[1]-+pb[1]); });
      }
      if(mk.label === "BTTS & total goals 2.5" && (goals > 2.5 || goals+maxAdd < 2.5)){
        // Round 7 (item 7): once 3 goals have landed, the "Over 2.5" leg is
        // already decided — "Yes & Over 2.5" is no longer a combo (it is just
        // BTTS at a stale price) and "Yes & Under 2.5" has already lost.
        // Both options go, so the market closes whole. Round 9 (item 6):
        // the same holds in the other direction — once even the maximum
        // still-scoreable goals cannot reach 2.5, the Over leg is dead.
        mk.opts = [];
      }
      if(mk.label === "Half-time / Full-time" && htWin){
        // The 1st-half leg is already decided — keep only options whose HT
        // leg matches the actual half-time result.
        mk.opts = mk.opts.filter(op=>{
          const leg = op.n.split(" / ")[0];
          return (htWin==="H" && leg===m.home) || (htWin==="D" && leg==="Draw") || (htWin==="A" && leg===m.away);
        });
      }
      if(mk.label === "Anytime goalscorer"){
        // A player who already scored has already won this bet.
        mk.opts = mk.opts.filter(op=>!scored.has(op.n));
      }
      if(mk.label === "To score 2+ goals"){
        // A player who already has 2 goals has already won this bet.
        mk.opts = mk.opts.filter(op=>goalsOf(op.n)<2);
      }
      if(mk.label === "To score in 2nd half"){
        mk.opts = mk.opts.filter(op=>!scored2nd.has(op.n));
      }
    }
    // Markets whose options were all decided are removed whole (an empty
    // market must never render).
    for(const g of Object.keys(groups)) groups[g] = groups[g].filter(mk=>mk.opts.length>0);
  }
  // Round 7: drop any option whose name is missing (a team with a single
  // scorer in the sample data has no scH[1] — the option would render as
  // "undefined" and crash the search index), then drop any market left empty.
  for(const list of Object.values(groups)) for(const mk of list){
    mk.opts = mk.opts.filter(op=>op && op.n);
  }
  for(const g of Object.keys(groups)) groups[g] = groups[g].filter(mk=>mk.opts.length>0);
  // Round 7 (item 8): re-apply the persisted live-price overlay so a
  // rebuild (gate crossing, reload) never resets drifted prices to the
  // seeded values — a reload shows the same prices, not a re-randomised set.
  // Skipped when opts.noOverlay (the cash-out model's clean price).
  if(m._overlay && !opts.noOverlay){
    for(const list of Object.values(groups)) for(const mk of list){
      mk.opts.forEach(op=>{ const v = m._overlay[mk.label+"|"+op.n]; if(typeof v==="number") op.odds = v; });
    }
  }
  // Round 8 (item 2): no odd anywhere may be below 1.00 — clamp the floor
  // to 1.01. This runs AFTER the overlay, so a stale persisted price (e.g.
  // a v7 Draw-no-bet overlay at 0.92) is clamped too.
  for(const list of Object.values(groups)) for(const mk of list){
    mk.opts.forEach(op=>{ op.odds = clampOdds(op.odds); });
  }
  return groups;
}

   re-render. The ping carries no data — the state itself lives in storage. */

/* Round 7 — CLOCK MODEL (half time + persistence).
   Every live match carries a clock BASE {minute, at}: at wall time `at` the
   match minute was `minute`. The base is persisted (see saveLiveState), so a
   reload continues the clock from the saved minute plus the real minutes
   elapsed since the save — never backwards, never re-seeded.
   Half time: when a live soccer match's clock reaches 45' it STOPS for
   HT_MS of real time ("Half time"), then the 2nd half starts at 46'. The
   clock is still 1x real time and capped at 90' (Round 4). */
const HT_MS = 60000; // half time lasts 60 real seconds in the demo (a real 15' break would stall the prototype)
function clockBase(m){
  if(!m._clockBase) m._clockBase = {minute: m.minute||0, at: Date.now()};
  return m._clockBase;
}
/* Pure clock for a live soccer match at wall time `now`: {minute, period}.
   period: "1h" | "ht" | "2h" | "ft". */
function soccerClock(m, now){
  const base = clockBase(m);
  const raw = base.minute + Math.floor((now - base.at)/60000);
  if(base.minute <= 45){
    const t45 = base.at + (45 - base.minute)*60000;
    if(now < t45) return {minute: Math.min(45, raw), period: "1h"};
    if(now < t45 + HT_MS) return {minute: 45, period: "ht"};
    const after = 46 + Math.floor((now - (t45 + HT_MS))/60000);
    const min = Math.min(90, after);
    return {minute: min, period: min>=90 ? "ft" : "2h"};
  }
  const min = Math.min(90, raw);
  return {minute: min, period: min>=90 ? "ft" : "2h"};
}
function curMin(m){
  if(m.sport==="Soccer" && m.status==="live") return soccerClock(m, Date.now()).minute;
  return (m.minute||0) + Math.floor((Date.now()-startTs)/60000);
}
/* Round 8 (item 4) — the seconds shown with a soccer clock must come from
   the SAME clock base as the minute. The old code showed session seconds
   (counted from page load) next to a match-relative minute, so after a
   reload the two drifted apart and the clock appeared to run backwards
   (44'49" -> 44'11"). Seconds are derived from the base exactly like the
   minute, so minute and seconds can only move forward together. */
function soccerSec(m, now){
  const base = clockBase(m);
  if(base.minute <= 45){
    const t45 = base.at + (45 - base.minute)*60000;
    if(now < t45) return Math.floor((now - base.at)/1000) % 60;
    if(now < t45 + HT_MS) return 0;
    return Math.floor((now - (t45 + HT_MS))/1000) % 60;
  }
  return Math.floor((now - base.at)/1000) % 60;
}
/* The ONE period label, used on the match page, list rows and the Bets page
   (item 1): minutes 1-45 = "1st half", 46-90 = "2nd half", 45' paused =
   "Half time". */
function matchPeriod(m){
  if(m.sport!=="Soccer" || m.status!=="live") return null;
  if(m._void) return "void";
  return soccerClock(m, Date.now()).period;
}
function periodLabel(m){
  const p = matchPeriod(m);
  return p==="1h" ? "1st half" : p==="ht" ? "Half time" : p==="2h" ? "2nd half" : p==="ft" ? "Full time" : p==="void" ? "Postponed" : "";
}
function isHT(m){ return matchPeriod(m)==="ht"; }
function isFirstHalfOver(m){ const p = matchPeriod(m); return p==="ht" || p==="2h" || p==="ft"; }
function isFT(m){ return m.sport==="Soccer" && m.status==="live" && !m._void && soccerClock(m, Date.now()).period==="ft"; }
function isVoided(m){ return !!m._void; }
/* A finished match (any sport): FT soccer, a basketball game at 00:00 in Q4,
   a completed tennis match. Finished matches leave Live, show no odds and
   never tick again. A voided match is its own state, not "finished". */
function isFinished(m){
  if(m._void) return false;
  if(m.sport==="Soccer") return isFT(m);
  if(m.sport==="Basketball") return bbOver(m);
  if(m.sport==="Tennis") return tennisOver(m);
  return false;
}
function finishedLabel(m){
  if(m.sport==="Basketball" || m.sport==="Tennis") return "Final";
  return "FT";
}
function isLiveNow(m){ return m.status==="live" && !isFT(m) && !m._void && !isFinished(m); }
function liveCountNow(){ return MATCHES.filter(isLiveNow).length; }
/* (Round 8: curSec() was removed — the seconds shown with a soccer clock
   come from soccerSec(m), the match's own clock base, not the session.) */
/* Round 7 — BASKETBALL CLOCK (item 4). A quarter is 12:00, counting DOWN
   every second; at 00:00 the next quarter starts at 12:00. Pure function of
   the persisted base {q, sec, at} — a reload continues the countdown. */
const BB_QSEC = 720; // 12:00 per quarter
function bbBase(m){
  if(!m._bbBase){
    const parts = (m.period||"Q1 12:00").split(" ");
    const q = parseInt((parts[0]||"Q1").slice(1), 10) || 1;
    const t = (parts[1]||"12:00").split(":");
    m._bbBase = {q, sec: (parseInt(t[0],10)||0)*60 + (parseInt(t[1],10)||0), at: Date.now()};
  }
  return m._bbBase;
}
function bbNow(m){ // {q, sec, over} — sec = seconds left in the quarter
  const b = bbBase(m);
  const total = (4 - b.q)*BB_QSEC + b.sec; // seconds left in the game from the base
  let rem = total - Math.floor((Date.now()-b.at)/1000);
  if(rem<=0) return {q:4, sec:0, over:true};
  const qr = Math.ceil(rem/BB_QSEC); // quarters remaining (incl. current)
  const q = 5 - qr;
  const sec = rem - (qr-1)*BB_QSEC;

  if(inSlip.length && Math.random()<0.6){
    const s=inSlip[Math.floor(Math.random()*inSlip.length)];
    target={m:MATCHES.find(x=>x.id===s.matchId), label:s.market};
  } else {
    const m=live[Math.floor(Math.random()*live.length)];
    const groups = Object.values(marketsFor(m)).flat().filter(mk=>!mk.suspended && mk.label!=="Match result");
    const mk=groups[Math.floor(Math.random()*groups.length)];
    target={m, label:mk.label};

  suspendMarket(target.m.id, target.label, 15000);

/* Shared suspension path — used by the live engine, the VAR script and the
   judge preview button, so all three suspend (and unsuspend) the same way. */
let suspState = {}; // key -> {until: epoch-ms, timer: id} — countdown + manual resume (item 19)
function suspendMarket(matchId, label, ms, forceToast){
  const m = MATCHES.find(x=>x.id===matchId); if(!m) return;
  const key = marketKey(matchId, label);
  if(suspendedMarkets.has(key)){ toast("Already suspended: "+label); return; }
  suspendedMarkets.add(key);
  markState("suspended");
  slip.forEach(s=>{ if(s.matchId===matchId && s.market===label){ s.suspended=true; } });
  // NOTE (Round 4): the stake input + quick chips stay ENABLED on a suspended
  // selection — disabling them dropped focus mid-typing (a disabled input
  // cannot hold focus, so a suspension yanked the caret and the user's
  // keystrokes went nowhere — the friend's R5 complaint). Place is the real
  // guard (placeBets refuses suspended selections), and the ⛔ banner shows it.
  // Round 7 (item 16): the suspension toast is scoped to the match on
  // screen (or a market in the slip) — a suspension on another match no
  // longer floats a banner naming that match over the page being viewed.
  const onScreen = location.hash === "#/match/"+matchId;
  const inSlip = slip.some(s=>s.matchId===matchId && s.market===label);
  if(forceToast || onScreen || inSlip) toast("⚠️ Market suspended: "+label+" — "+m.home+" v "+m.away, "err");
  // Round 3 (item 19): a visible countdown + a manual "Resume now" — the
  // judge no longer has to wait ~15s blind for a suspension to lift.
  const dur = ms||15000;
  suspState[key] = { until: Date.now()+dur, timer: setTimeout(()=>unsuspendMarket(key), dur) };
  renderSlip();
  if(location.hash.startsWith("#/match")) render();
}
function unsuspendMarket(key){
  if(!suspendedMarkets.has(key)) return;
  const st = suspState[key];
  if(st){ clearTimeout(st.timer); delete suspState[key]; }
  suspendedMarkets.delete(key);
  const [matchId, label] = key.split("|");
  slip.forEach(s=>{ if(s.matchId===matchId && s.market===label){ s.suspended=false; } });
  renderSlip();
  if(location.hash.startsWith("#/match")) render();
}
function suspRemaining(key){
  const st = suspState[key];
  if(!st) return null;
  return Math.max(0, Math.ceil((st.until - Date.now())/1000));
}

      // 30'/45' gate-crossing check alone left them offered — and bettable —
      // during the whole half-time pause.)
      const period = matchPeriod(m);
      if(m._lastPeriod===undefined) m._lastPeriod = period;
      else if(m._lastPeriod!==period){
        m._lastPeriod = period;
        m._markets = marketsFor(m);
        // Round 8 (item 1): a period change re-renders EVERYWHERE, not just
        // the match page — the Live list row must flip to "Half time" with
        // paused odds the moment the break starts, and back when it ends.
        needRender = true;
      }
      // Minute rollover: reprice the 1X2 off the score + minute (item 7)
      // and rebuild the markets — the impossible-market gate depends on the
      // minute (a total line the match can no longer reach closes) and on
      // the score, so rebuilding only at 30'/45' crossings is not enough.
      if(m._lastMin===undefined) m._lastMin = lm;
      else if(m._lastMin!==lm){
        m._lastMin = lm;
        applyScoreOdds(m);
        const before = m._markets ? Object.values(m._markets).flat().map(x=>x.label).join(",") : "";
        m._markets = marketsFor(m);
        const after = Object.values(m._markets).flat().map(x=>x.label).join(",");
        if(before!==after) needRender = true;
      }

      const t = tennisNow(m);
      if(t.over && !m._finished){
        m._finished = true;
        const sw = tennisSetsWon(m);

        // bet on it settles — won/lost by the final sets/games.
        settleMatchBets(m);
        saveLiveState(); needRender = true;
      }
      // A set finishing changes the finished-set gate — rebuild the markets.
      // Round 9 (item 6): a GAME finishing changes the total-games gate
      // too (a decided 26.5 line must close mid-set, not at the next set),
      // so rebuild whenever the games tally changes, not just the sets.
      const nSets = t.sets.length, nGames = t.totalGames;
      if(m._lastTennisSets===undefined){ m._lastTennisSets = nSets; m._lastTennisGames = nGames; }
      else if(m._lastTennisSets!==nSets || m._lastTennisGames!==nGames){
        m._lastTennisSets = nSets; m._lastTennisGames = nGames;
        m._markets = marketsFor(m);
        if(location.hash.startsWith("#/match/"+m.id)) needRender = true;
      }

      // Round 9 (item 3): the basketball score engine runs every second —
      // baskets land as the game clock runs, so the score moves.
      const scoreChanged = syncBbScore(m);
      if(scoreChanged){
        m._markets = marketsFor(m);
        needRender = true;
      }
      if(bbOver(m) && !m._finished){
        m._finished = true;
        // Round 9 (item 1): the moment a basketball game goes FINAL, every
        // bet on it settles — won/lost by the final score.
        settleMatchBets(m);
        saveLiveState(); needRender = true;
      }
    }
  });
  if(needRender) render();
  return needRender;
}

  if(!m._markets) m._markets = marketsFor(m);

    for(const mk of g){

        const op = mk.opts.find(o=>o.n===sel);
        if(op) return clampOdds(op.odds); // Round 8 (item 2): floor 1.01

      const w = t.sets[1][0]>t.sets[1][1] ? "H" : "A";

    case "1st half result": return isH?(htW==="H"?"won":"lost"):isA?(htW==="A"?"won":"lost"):isD?(htW==="D"?"won":"lost"):null;
    case "2nd half result": return isH?(h2W==="H"?"won":"lost"):isA?(h2W==="A"?"won":"lost"):isD?(h2W==="D"?"won":"lost"):null;
    case "Half with most goals": if(sel==="1st half") return htGoals>h2?"won":"lost"; if(sel==="2nd half") return h2>htGoals?"won":"lost"; if(sel==="Equal") return htGoals===h2?"won":"lost"; return null;
    case "1st half total goals 0.5": return ouVs(0.5, htGoals);
    case "2nd half total goals 1.5": return ouVs(1.5, h2);
    case "Total goals odd / even": return sel==="Odd"?(goals%2===1?"won":"lost"):(goals%2===0?"won":"lost");
    case "Both teams to score in 2nd half":
    case "2nd half — both teams to score": { const both2 = h2hs>0&&h2as>0; return sel==="Yes"?(both2?"won":"lost"):(!both2?"won":"lost"); }
    default: break;
  }
  // "Both halves — X to win": home must win BOTH halves.
  if(b.market === "Both halves — "+m.home+" to win"){
    const both = htW==="H" && h2W==="H";
    return sel==="Yes" ? (both?"won":"lost") : (both?"lost":"won");
  }
  // Total-goals lines ("Total goals 2.5", … or the seeded label "Total
  // goals" with the line in the selection).
  if(/^Total goals/.test(b.market)){
    const line = numIn(b.market) !== null ? numIn(b.market) : numIn(sel);
    if(line===null) return null;
    return ouVs(line, goals);
  }
  // Team totals ("Arsenal total goals", "Brighton & Hove Albion total goals").
  if(b.market.endsWith(" total goals")){
    const team = b.market.replace(/ total goals$/,"");
    const total = team===m.home?hs:team===m.away?as:null;
    if(total===null) return null;
    const line = numIn(sel);
    if(line===null) return null;
    return ouVs(line, total);
  }
  // European handicap −1: home must win by 2+, exactly 1 is "Draw −1".
  // (Selections carry the line in the name — "Arsenal −1" — so match by
  // prefix, not by exact team name.)
  if(b.market==="European handicap −1"){
    const margin = hs-as;
    if(sel==="Draw −1") return margin===1?"won":"lost";
    if(sel.startsWith(m.home)) return margin>=2?"won":"lost";
    if(sel.startsWith(m.away)) return margin<=0?"won":"lost";
    return null;
  }
  // Asian handicap: the selection carries its own line ("Arsenal −1.5",
  // "Brighton & Hove Albion +1.5", "Arsenal 0"). Adjusted margin > 0 wins,
  // exactly 0 is a push (void), below 0 loses.
  if(/^Asian handicap/.test(b.market)){
    const hm = sel.match(/([−+\-])?\s*(\d+(?:\.\d+)?)\s*$/);
    if(!hm) return null;
    const h = (hm[1]==="+"?1:-1)*parseFloat(hm[2]);

  if(b.market==="Total corners" || /^Total corners \d/.test(b.market)){
    const line = b.market==="Total corners"?9.5:numIn(b.market);
    return ouVs(line, m.corners||0);
  }
  if(b.market==="Total cards") return ouVs(3.5, m.cards||0);

  // not win. "Next goal" / "Next goalscorer" are always suspended, so no
  // bet on them can exist; they land here too.
  return null;
}
function htScoreOf(m){
  if(m.ht) return {hs: m.ht.hs, as: m.ht.as};
  const scorers = (m.scorers||[]);
  return {
    hs: scorers.filter(s=>s.half===1 && teamOfPlayer(s.p)===m.home).length,
    as: scorers.filter(s=>s.half===1 && teamOfPlayer(s.p)===m.away).length
  };
}
/* Round 7 (item 3) — HALF-TIME SETTLEMENT. At half time, every first-half
   market whose outcome is decided by the 1st half settles: WON/LOST, moved
   to Settled, returns credited. Markets that need the 2nd half (HT/FT, 2nd
   half result, Half with most goals) stay open. Returns "won"/"lost" or
   null when the market is not decided at half time. */
function settleHTOutcome(b, m){
  const ht = htScoreOf(m);
  const htGoals = ht.hs + ht.as;
  const htW = ht.hs>ht.as?"H":ht.hs<ht.as?"A":"D";
  const scorers = (m.scorers||[]).filter(s=>s.half===1).sort((a,c)=>a.min-c.min);
  const first = scorers[0]||null;
  const goalsOf = p => scorers.filter(s=>s.p===p).length;
  const sel = String(b.sel||"").replace(/ to win$/,"").replace(/ anytime scorer$/,"").replace(/ goals$/,"");
  const isH = sel===m.home, isA = sel===m.away, isD = sel==="Draw";
  const ouVs = (line, total) => sel.startsWith("Over") ? (total>line?"won":"lost") : sel.startsWith("Under") ? (total<line?"won":"lost") : null;
  switch(b.market){
    case "1st half result": return isH?(htW==="H"?"won":"lost"):isA?(htW==="A"?"won":"lost"):isD?(htW==="D"?"won":"lost"):null;
    case "1st half total goals 0.5": return ouVs(0.5, htGoals);
    case "First goalscorer": if(!first) return null; return first.p===sel?"won":"lost";
    case "Team to score first":
      if(!first) return null;
      if(sel==="No goal") return "lost";
      if(isH) return teamOfPlayer(first.p)===m.home?"won":"lost";
      if(isA) return teamOfPlayer(first.p)===m.away?"won":"lost";
      return null;
    case "First goal before 30:00": {
      const early = scorers.find(s=>s.min<30);
      if(early) return sel==="Yes"?"won":"lost";
      return sel==="Yes"?"lost":"won"; // no goal before 30' — decided at HT
    }
    case "Anytime goalscorer": {
      const scored = new Set(scorers.map(s=>s.p));
      return scored.has(sel) ? "won" : null; // not scored yet — still live in the 2nd half
    }
    case "To score 2+ goals": return goalsOf(sel)>=2 ? "won" : null;
    default: return null;
  }
}
function settleHTBets(m){
  if(!m || m.sport!=="Soccer") return 0;
  const bets = myBets.open.filter(b=>matchOfBet(b)===m && settleHTOutcome(b, m)!==null);
  if(!bets.length) return 0;
  bets.forEach(b=>{
    const outcome = settleHTOutcome(b, m);
    const rem = b.stake;
    let ret = 0;
    if(outcome==="won") ret = Math.round(rem*b.odds*100)/100;
    else if(outcome==="void") ret = rem;
    myBets.open = myBets.open.filter(x=>x.id!==b.id);
    myBets.settled.unshift({id:b.id, sel:b.sel, market:b.market, match:b.match, comp:b.comp, odds:b.odds, stake:b.stake, result:outcome, ret:ret, placed:b.placed, ...(b.partCashed?{partCashed:b.partCashed}:{})});
    balance = Math.round((balance+ret)*100)/100;
  });
  saveAll();
  return bets.length;
}
function settleMatchBets(m){
  // Round 9 (item 1): every sport settles. The old soccer-only guard is
  // why tennis and basketball bets never settled — the match went FINAL
  // and the bets stayed OPEN for ever.
  if(!m) return 0;
  const bets = myBets.open.filter(b=>matchOfBet(b)===m);
  if(!bets.length) return 0;
  bets.forEach(b=>{
    // An outcome that can't be decided from the stored events (first
    // corner, next card) settles as lost — the bet did not win.
    const outcome = settleOutcome(b, m) || "lost";
    const rem = b.stake; // remaining stake — partial cash out already shrank it
    let ret = 0;
    if(outcome==="won") ret = Math.round(rem*b.odds*100)/100;
    else if(outcome==="void") ret = rem;
    myBets.open = myBets.open.filter(x=>x.id!==b.id);
    myBets.settled.unshift({id:b.id, sel:b.sel, market:b.market, match:b.match, comp:b.comp, odds:b.odds, stake:b.stake, result:outcome, ret:ret, placed:b.placed, ...(b.partCashed?{partCashed:b.partCashed}:{})});
    balance = Math.round((balance+ret)*100)/100;
  });
  saveAll();
  return bets.length;
}
/* Round 9 (item 2) — THE CASH-OUT MODEL. The old formula paid
   stake × current odds × 0.82, which pays LESS the more likely the bet is
   to win: as the odds shorten toward 1.00 the cash-out falls toward 82%
   of the stake — exactly backwards (the audit caught it: a Draw at 1.10
   in the 88' cashed out at 9.02 on a 10 stake that was nearly certain to
   return 24.60). The correct value is the bet's fair value right now:
   cash-out = min(potential, stake × placed odds / current odds), where
   "current odds" is the DETERMINISTIC live price of the selection (the
   score-aware model for 1X2, the Poisson model for goals/total lines,
   the same models that price the displayed odds) — never the per-tab
   drifted price, so every tab shows the same value, and never the
   placed odds, so the value is never frozen. When the odds shorten the
   win probability rises and the cash-out RISES toward the full
   potential; when they drift out it falls. A selection whose outcome is
   already decided cashes out at its full potential (won) or at 0
   (lost). */
function normSel(b){
  let s = String(b.sel || "").trim();
  // The seeded bets carry the long forms ("Arsenal to win",
  // "Over 2.5 goals", "ARS No. 9 anytime scorer"); the market options
  // carry the short forms. Strip the suffixes the same way settleOutcome
  // already does, so a seeded bet matches its market option.
  s = s.replace(/\s+to win$/i, "").replace(/\s+goals$/i, "").replace(/\s+anytime scorer$/i, "");
  return s;
}
function liveDecided(b, m){
  // "won" | "lost" | null — the bet's outcome is already certain, from the
  // current state (not from the final score: a bet can be decided mid-match).
  if(!m) return null;
  const sel = normSel(b), mk = b.market;
  if(m.sport==="Soccer" && isLiveNow(m)){
    const min = curMin(m), hs = m.hs||0, as = m.as||0, goals = hs+as;
    const maxAdd = Math.ceil(Math.max(0, 90-min)/4);
    if(mk==="Match result"){
      if(sel===m.home){ if(hs > as+maxAdd) return "won"; if(as > hs+maxAdd) return "lost"; }
      else if(sel===m.away){ if(as > hs+maxAdd) return "won"; if(hs > as+maxAdd) return "lost"; }
      else if(sel==="Draw"){ if(Math.abs(hs-as) > maxAdd) return "lost"; }
    }
    if(mk==="Total goals"){
      const mm = sel.match(/(Over|Under) (\d+(?:\.\d+)?)/);
      if(mm){
        const line = parseFloat(mm[2]);
        if(mm[1]==="Over"){ if(goals>line) return "won"; if(goals+maxAdd<line) return "lost"; }
        else { if(goals>line) return "lost"; if(goals+maxAdd<line) return "won"; }
      }
    }
    if(mk==="Both teams to score"){
      if(sel==="Yes" && hs>0 && as>0) return "won";
    }
  }
  if(m.sport==="Tennis" && m.status==="live"){
    const sw = tennisSetsWon(m);
    if(mk==="Match winner"){
      if(sw[0] >= 2 && sel===m.home) return "won";
      if(sw[1] >= 2 && sel===m.away) return "won";
      if(sw[0] >= 2 || sw[1] >= 2) return "lost";
    }
  }
  if(m.sport==="Basketball" && m.status==="live"){
    const bb = bbNow(m);
    const total = (m.hs||0) + (m.as||0);
    const remSec = bb.over ? 0 : (4-bb.q)*BB_QSEC + bb.sec;
    const maxAdd = Math.ceil(remSec/60*6);
    if(mk==="Match winner"){
      if(m.hs > m.as+maxAdd && sel===m.home) return "won";
      if(m.as > m.hs+maxAdd && sel===m.away) return "won";
      if(m.hs > m.as+maxAdd && sel===m.away) return "lost";
      if(m.as > m.hs+maxAdd && sel===m.home) return "lost";
    }
    if(mk==="Total points 224.5" || mk==="Total points 214.5" || mk==="Total points 234.5"){
      const mm = sel.match(/(Over|Under) (\d+(?:\.\d+)?)/);
      if(mm){
        const line = parseFloat(mm[2]);
        if(mm[1]==="Over"){ if(total>line) return "won"; if(total+maxAdd<line) return "lost"; }
        else { if(total>line) return "lost"; if(total+maxAdd<line) return "won"; }
      }
    }
  }
  return null;
}
function liveProb(b, m){
  // The probability (0..1) that the bet wins, from the current state.
  if(!m) return 0;
  const sel = normSel(b), mk = b.market;
  if(m.sport==="Soccer" && isLiveNow(m)){
    if(mk==="Match result"){
      const pr = scoreAwareProbs(m);
      if(sel===m.home) return pr.h;
      if(sel===m.away) return pr.a;
      return pr.d;
    }
    if(mk==="Total goals" || mk==="Both teams to score" || mk==="BTTS & total goals 2.5" || mk==="Draw no bet" || mk==="Double chance"){
      // Goals markets: a Poisson model on the goals still to come, from the
      // current score and minute (the same model that prices the live odds).
      const rem = Math.max(0, 90 - curMin(m)) / 90;
      const lamH = 1.35*rem, lamA = 1.15*rem, hs = m.hs||0, as = m.as||0;
      let p = 0;
      for(let i=0;i<=6;i++) for(let j=0;j<=6;j++){
        const prob = poissonP(i, lamH) * poissonP(j, lamA);
        const fh = hs+i, fa = as+j;
        if(mk==="Total goals"){
          const mm = sel.match(/(Over|Under) (\d+(?:\.\d+)?)/);
          if(!mm) return 0;
          const line = parseFloat(mm[2]);
          if((mm[1]==="Over" && fh+fa>line) || (mm[1]==="Under" && fh+fa<line)) p += prob;
        } else if(mk==="Both teams to score"){
          if(sel==="Yes" && fh>0 && fa>0) p += prob;
          if(sel==="No" && (fh===0 || fa===0)) p += prob;
        } else if(mk==="BTTS & total goals 2.5"){
          const both = fh>0 && fa>0, over = fh+fa>2.5;
          if(sel==="Yes & Over 2.5" && both && over) p += prob;
          if(sel==="Yes & Under 2.5" && both && !over) p += prob;
        } else if(mk==="Draw no bet"){
          if(sel===m.home && fh>fa) p += prob;
          if(sel===m.away && fa>fh) p += prob;
        } else if(mk==="Double chance"){
          const hWin = fh>fa, dWin = fh===fa, aWin = fa>fh;
          if((sel.includes(m.home) && sel.includes("Draw")) && (hWin || dWin)) p += prob;
          if((sel.includes(m.away) && sel.includes("Draw")) && (aWin || dWin)) p += prob;
          if(sel.includes(m.home) && sel.includes(m.away) && (hWin || aWin)) p += prob;
        }
      }
      return p;
    }
  }
  if(m.sport==="Tennis" && m.status==="live"){
    if(mk==="Match winner"){
      const sw = tennisSetsWon(m);
      const g = m.games || [0,0];
      let p = 0.5;
      if(sw[0]===1 && sw[1]===1) p = sel===m.home ? 0.5 + (g[0]-g[1])*0.06 : 0.5 - (g[0]-g[1])*0.06;
      else if(sw[0]===1) p = sel===m.home ? 0.72 : 0.28;
      else if(sw[1]===1) p = sel===m.home ? 0.28 : 0.72;
      return Math.min(0.99, Math.max(0.01, p));
    }
  }
  if(m.sport==="Basketball" && m.status==="live"){
    if(mk==="Match winner"){
      const bb = bbNow(m);
      const remMin = bb.over ? 0 : ((4-bb.q)*BB_QSEC + bb.sec)/60;
      const diff = (m.hs||0) - (m.as||0);
      const homeP = 1 / (1 + Math.exp(-(diff*0.14 + (remMin>0 ? 0.15 : 0))));
      return sel===m.home ? homeP : 1-homeP;
    }
  }
  return 0;
}
function findBetOdds(b, m){
  // The DETERMINISTIC current price of the bet's selection (no per-tab
  // drift): the score-aware 1X2 price for a soccer Match result bet, the
  // clean (no-overlay) market list for everything else. Returns 0 when
  // the selection is no longer offered.
  if(!m) return 0;
  if(m.sport==="Soccer" && b.market==="Match result"){
    const x2 = scoreAwareX2(m);
    const sel = normSel(b);
    if(sel===m.home) return x2.h;
    if(sel===m.away) return x2.a;
    return x2.d;
  }
  const groups = marketsFor(m, {noOverlay:true});
  for(const list of Object.values(groups)) for(const mk of list){
    if(mk.label !== b.market) continue;
    const op = mk.opts.find(o => o.n === normSel(b) || o.n === b.sel);
    if(op) return op.odds;
  }
  return 0;
}
function liveCashout(b){
  const m = matchOfBet(b);
  // Round 9 (item 4): cash out is only for a match that is live RIGHT NOW.
  // A bet on a match that has not kicked off has no cash-out value at all —
  // the old code paid stake × odds × 0.82 on any bet, so a pre-match bet
  // showed a cash-out 90 minutes before kickoff.
  if(!m || !isLiveNow(m)) return 0;
  if(isSuspended(m, b.market)) return 0;
  const potential = b.stake * b.odds;
  const decided = liveDecided(b, m);
  if(decided==="won") return Math.round(potential*100)/100;
  if(decided==="lost") return 0;
  // Fair value: the chance of winning, times the potential, capped at the
  // potential. Written as stake × placed odds / current odds so it tracks
  // the displayed odds exactly — when the current odds shorten, the value
  // RISES. (liveProb is the same model that prices the odds, so the two
  // routes agree; the odds route is the one the user can check against the
  // match page.)
  const cur = findBetOdds(b, m);
  if(cur && cur > 0){
    const v = b.stake * b.odds / cur;
    return Math.round(Math.min(potential, Math.max(0, v))*100)/100;
  }
  const p = liveProb(b, m);
  if(!p) return 0;
  return Math.round(Math.min(potential, Math.max(0, b.stake * b.odds * p))*100)/100;
}
function cashOutSuspended(b){
  const m = matchOfBet(b);
  return !!(m && isSuspended(m, b.market));
}
function cashOut(id){
  const b=myBets.open.find(x=>x.id===id); if(!b) return;
  // Round 6: a finished match's bets have already settled — cash out is
  // never offered on them. (Settlement removes them from Open, so this is
  // a defensive guard only.)
  const mmFT=matchOfBet(b);
  if(mmFT && isFT(mmFT)){ toast("Full time — this bet has already settled", "err"); return; }
  // Round 9 (item 4): cash out is only for a match that is live right now.
  // A pre-match bet has no cash-out value — refuse rather than paying 0.
  if(mmFT && !isLiveNow(mmFT)){ toast("Cash out opens at kickoff — this match hasn't started yet", "err"); return; }
  if(cashOutSuspended(b)){ toast("⛔ Cash out paused — “"+b.market+"” is suspended on this match", "err"); return; }
  const val = liveCashout(b);
  myBets.open=myBets.open.filter(x=>x.id!==id);
  // If part of this bet was already cashed out, keep that amount on the
  // settled entry so the money trail is complete (total received = part + ret).
  myBets.settled.unshift({id:b.id, sel:b.sel, market:b.market, match:b.match, comp:b.comp, odds:b.odds, stake:b.stake, result:"cashed", ret:val, placed:b.placed, ...(b.partCashed?{partCashed:b.partCashed}:{})});
  balance = Math.round((balance + val)*100)/100; // cash-out returns to the balance
  saveAll(); markState("cashed"); renderSlip(); renderPanel();
  toast("💰 Cashed out "+fmt(val)+" USDT — "+b.sel, "ok");
  if(location.hash==="#/bets") render();
}
// Round 4: PARTIAL cash out (the rival's idea — within the brief: cash out is
// a cash-out variant, not a promo/multi/boost). Pays pct% of the cash-out
// value now; the rest of the stake stays open at the same odds with
// recomputed potential + cash-out value. 100% is the full cash out.
// Math (rival's verified example): cash-out 31.40, 50% → 15.70 paid now,
// remaining stake 12.50 @1.50 (potential 18.75), balance +15.70.
function cashOutPartial(id, pct){
  const b=myBets.open.find(x=>x.id===id); if(!b) return;
  const mmFT=matchOfBet(b);
  if(mmFT && isFT(mmFT)){ toast("Full time — this bet has already settled", "err"); return; }
  // Round 9 (item 4): no partial cash out before kickoff either.
  if(mmFT && !isLiveNow(mmFT)){ toast("Cash out opens at kickoff — this match hasn't started yet", "err"); return; }
  if(cashOutSuspended(b)){ toast("⛔ Cash out paused — “"+b.market+"” is suspended on this match", "err"); return; }
  if(pct>=100){ cashOut(id); return; }
  const live = liveCashout(b);
  const paid = Math.round(live * pct/100 * 100)/100;
  const remStake = Math.round(b.stake * (100-pct)/100 * 100)/100;
  b.partCashed = Math.round(((b.partCashed||0) + paid)*100)/100;
  b.stake = remStake;
  // Round 9 (item 2): the remaining bet's cash-out is the live fair value
  // of the remaining stake — not the old stake × odds × 0.82.
  b.cashout = liveCashout(b);
  balance = Math.round((balance + paid)*100)/100;
  saveAll(); markState("cashed"); renderSlip(); renderPanel();
  toast("💰 Cashed out "+fmt(paid)+" USDT ("+pct+"%) — "+fmt(remStake)+" USDT still open at "+fmt(b.odds)+".", "ok");
  if(location.hash==="#/bets") render();
}

// Round 3 (item 5): slip messages are DERIVED from live slip state, not

// every render, so a banner can never show numbers from an earlier move —
// and it disappears the moment the condition clears (accept / remove /
// resume). One-shot results (placed / failed / insufficient) keep static text.
function slipMsgText(){
  if(!slipMsg) return "";
  if(slipMsg.key==="odds-changed"){
    const s = slip.find(x=>x.changed);
    if(!s) return "";
    return "Odds changed — accept the new odds for “"+s.sel+"” ("+fmt(s.oldOdds)+" → "+fmt(s.odds)+") before placing.";
  }
  if(slipMsg.key==="suspended"){
    const s = slip.find(x=>x.suspended);
    if(!s) return "";
    return "Bet failed — “"+s.sel+"” ("+s.market+") is suspended. Remove it or wait for the market to reopen.";
  }
  if(slipMsg.key==="no-stake"){
    const s = slip.find(x=>!(parseFloat(x.stake)>0));
    if(!s) return "";
    return "Bet failed — enter a stake (USDT) for “"+s.sel+"”. Stakes of 0 can't be placed.";
  }
  if(slipMsg.key==="ended"){
    const s = slip.find(x=>{ const mm=MATCHES.find(y=>y.id===x.matchId); return mm && isFT(mm); });
    if(!s) return "";
    return "Bet failed — “"+s.sel+"” can't be placed: that match has ended (full time). Remove it to place the rest.";
  }
  return slipMsg.msg||"";
}
function syncSlipMsg(){
  // Recompute the stored text from live state; drop the message entirely
  // once its condition no longer holds (stale banners never survive a render).
  if(!slipMsg) return;
  const t = slipMsgText();
  if(!t) slipMsg = null; else slipMsg.msg = t;
}

      el.innerHTML = `<span>${esc(slipMsg.msg)}</span><button class="slip-msg-x" onclick="clearSlipMsg()" aria-label="Dismiss">✕</button>`;

/* Round 8 (item 3) — RESET DEMO DATA, fixed. Remove all four state keys,
   tell other open tabs to reset too, then reload into the seeded state.
   The `resetting` flag (set FIRST) suppresses every save — the 5s autosave,
   the visibilitychange save and the beforeunload save — so nothing can
   re-persist the old demo between the key removal and the reload. */
function resetDemo(){
  // Round 9 (item 12): a reset restores EVERYTHING — balance, bets,
  // follows AND the match state/clocks. The marker goes up FIRST so no
  // tab (this one or another) can re-save the old state while the keys
  // are being removed; the in-memory state is restored to the seed before
  // the reload, so even a skipped reload leaves the seed in place.
  resetting = true;
  try{ localStorage.setItem("hb-proto-reset", "1"); }catch(e){}
  try{ ["follows","mybets","balance","live"].forEach(k=>localStorage.removeItem("hb-proto-"+k)); }catch(e){}
  try{ if(hbChannel) hbChannel.postMessage({t:"reset", at:Date.now()}); }catch(e){}
  follows = JSON.parse(JSON.stringify(SEED_FOLLOWS));
  myBets = JSON.parse(JSON.stringify(SEED_MYBETS));
  balance = 1250;
  slip = []; slipMsg = null;
  MATCHES.forEach(m=>{
    const s = m._seed || {};
    delete m._clockBase; delete m._bbBase; delete m._tennisBase;
    delete m._x2; delete m._overlay; delete m._markets;
    delete m._finished; delete m._void; delete m._ft;
    delete m._lastPeriod; delete m._lastMin; delete m._lastGateMin; delete m._lastTennisSets; delete m._lastTennisGames;
    delete m._judgeGoals; delete m._judgeBaskets;
    m.status = s.status || m.status;
    m.minute = s.minute || 0; m.hs = s.hs; m.as = s.as;
    if(s.period!==null && s.period!==undefined) m.period = s.period;
    if(s.setScore!==null && s.setScore!==undefined) m.setScore = s.setScore;
    if(s.games) m.games = s.games.slice();
    m.scorers = (m._seedScorers || []).slice();
    m.corners = m._seedCorners || 0; m.cards = m._seedCards || 0;
  });
  [...suspendedMarkets].forEach(k=>unsuspendMarket(k));
  varActive = false;
  location.reload();
}

/* Round 7 (item 16) — KICKOFF TIMES. The demo's kickoff times are WIB
   (the user's timezone) — say so, and a match whose kickoff has already
   passed is "Started", not still listed as upcoming. */
const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function kickoffInfo(m){
  if(!m.time || !m.date) return {past:false, label:""};
  const dm = String(m.date).match(/([A-Za-z]{3}),?\s+(\d{1,2})/);
  const tm = String(m.time).match(/(\d{1,2}):(\d{2})/);
  if(!dm || !tm) return {past:false, label:m.time};
  const month = MONTHS[dm[1]];
  if(month===undefined) return {past:false, label:m.time};
  // The demo fixtures are dated Nov 2026; kickoffs are WIB (+07:00).
  const dt = new Date(Date.UTC(2026, month, +dm[2], +tm[1]-7, +tm[2]));
  // Round 9 (item 15b): a past kickoff says WHEN it started, in WIB —
  // the old code rendered a bare "Started" with no time at all.
  return {past: dt.getTime() < Date.now(), label: m.time+" WIB", ts: dt.getTime(), startedLabel: "Started · "+m.time+" WIB"};
}
/* Round 9 (item 10) — a match whose kickoff has passed but which the demo
   still lists as "upcoming" (it never went live in the seeded data) is a
   STARTED match: it must show a running clock + score like any live match
   (so minute 1 and minute 80 can be told apart) and must not sell
   minute-dependent markets. It stays status "upcoming" — it is not a live
   match in the system (no settlement, no cash out, no Live-list row) — so
   the live counts and the "Started" label the earlier rounds verified do
   not change. The clock/score are pure functions of the kickoff time, so
   every tab and reload agrees. */
function isStarted(m){
  if(!m || m.status !== "upcoming" || m._void) return false;
  const ko = kickoffInfo(m);
  return ko.past;
}
function startedInfo(m){
  // {min, period, hs, as, scorers, ft} — the match as it stands right now.
  const ko = kickoffInfo(m);
  const el = Math.max(0, Math.floor((Date.now() - (ko.ts || Date.now())) / 60000));
  let min, period;
  if(el <= 45){ min = el; period = "1h"; }
  else if(el <= 60){ min = 45; period = "ht"; }
  else if(el <= 105){ min = el - 15; period = "2h"; }
  else { min = 90; period = "ft"; }
  const evts = goalEvents(m).filter(e => e.min <= min);
  const hs = evts.filter(e => e.team === "home").length;
  const as = evts.filter(e => e.team === "away").length;
  const scorers = evts.map(e => ({p: e.scorer, min: e.min, half: e.min <= 45 ? 1 : 2}));
  return {min, period, hs, as, scorers, ft: period === "ft"};
}
function matchRow(m, showMore, mode){
  const ft = isFT(m);
  const live = isLiveNow(m);
  const voided = isVoided(m);
  const fin = isFinished(m) && !ft; // basketball/tennis finals (soccer FT is `ft`)
  const ht = m.sport==="Soccer" && isHT(m); // Round 8 (item 1): half-time break
  // Non-soccer rows use the sport's own market name — "Match result" is soccer-only.
  const resLabel = m.sport==="Soccer" ? "Match result" : "Match winner";
  // Tennis rows show the live set + current-set games (ticking, see
  // refreshClocks) — never a minute, tennis has no clock. Basketball shows
  // the counting-down quarter clock; soccer shows the ticking minute.
  // Round 7 (item 1): the period label is derived from the clock, so a list
  // row and the match page can never disagree.
  const liveWhen = m.sport==="Tennis" ? `<span class="live-badge">Live</span><div class="clock"><span data-tsets="${m.id}">Set ${tennisNow(m).sets.length+1}</span> · <span data-tgames="${m.id}">${tennisNow(m).games[0]}–${tennisNow(m).games[1]}</span></div>`
    : m.sport==="Basketball" ? `<span class="live-badge">Live</span><div class="clock"><span data-bb-clock="${m.id}">${bbLabel(m)}</span></div>`
    : ht ? `<span class="live-badge" style="background:var(--amber);color:#241a02">Half time</span><div class="clock" data-clock-min-match="${m.id}">45′</div>`
    : `<span class="live-badge">Live</span><div class="clock" data-clock-min-match="${m.id}">${curMin(m)}′</div>`;
  const ko = kickoffInfo(m);
  // Round 9 (item 10/15b): a started match shows its derived clock + score
  // and WHEN it started (WIB) — the old row said a bare "Started" with no
  // time, no minute and no score, so minute 1 and minute 80 looked alike.
  const started = isStarted(m);
  const st = started ? startedInfo(m) : null;
  const when = voided ? `<span class="live-badge" style="background:var(--muted2)">Postponed</span>`
    : ft ? `<span class="live-badge" style="background:var(--muted2)">FT</span>`
    : fin ? `<span class="live-badge" style="background:var(--muted2)">Final</span>`
    : live ? liveWhen
    : started ? (m.sport==="Soccer" ? `<b>Started · ${st.min}′</b><span class="small muted"> · ${esc(m.time)} WIB</span>${m.date}` : `<b>${esc(ko.startedLabel||"Started")}</b>${m.date}`)
    : `<b>${ko.label}</b>${m.date}`;
  const score = (live || ft || fin) ? `<span class="sc">${m.hs}</span>` : (started && m.sport==="Soccer") ? `<span class="sc">${st.hs}</span>` : "";
  const score2 = (live || ft || fin) ? `<span class="sc">${m.as}</span>` : (started && m.sport==="Soccer") ? `<span class="sc">${st.as}</span>` : "";
  // Truthful "+N": the number of OTHER markets on this match's page (total
  // markets minus the one already shown as the row's odds) — not a made-up number.
  if(!m._markets) m._markets=marketsFor(m);
  const totalMk=Object.values(m._markets).flat().length;
  const more = (ft || voided || fin) ? "" : (showMore===false ? "" : `<span class="mrow-more">+${Math.max(0,totalMk-1)} ›</span>`);
  const star = `<button class="starbtn ${follows.teams.includes(m.home)?"on":""}" onclick="event.stopPropagation();toggleFollowTeam('${esc(m.home)}')" title="Follow ${esc(m.home)}">★</button>`;
  return `<div class="mrow" onclick="go('#/match/${m.id}')">
    <div class="when">${when}</div>
    <div class="teams">
      <div class="tm">${crest(m.home)}${esc(m.home)} ${score}</div>
      <div class="tm">${crest(m.away)}${esc(m.away)} ${score2}</div>
    </div>
    ${star}
    ${voided?`<div class="modds"><span class="muted small" style="font-weight:700">Postponed</span></div>`
    :ft?`<div class="modds"><span class="muted small" style="font-weight:700">Full time</span></div>`
    :fin?`<div class="modds"><span class="muted small" style="font-weight:700">Final</span></div>`
    :ht?`<div class="modds"><span class="muted small" style="font-weight:700">Half time — odds paused</span></div>`
    :`<div class="modds">
      ${rowOdds(m, mode).join("")}
    </div>`}
    ${more}
  </div>`;
}
function featCard(m){
  const ft=isFT(m);
  const live=isLiveNow(m);
  const voided=isVoided(m);
  const fin=isFinished(m) && !ft;
  const ht=m.sport==="Soccer" && isHT(m); // Round 8 (item 1): half-time break
  const resLabel = m.sport==="Soccer" ? "Match result" : "Match winner";

  return `<div class="card feat" onclick="go('#/match/${m.id}')">

    ${voided?`<div class="muted small" style="font-weight:700">Postponed — all bets on this match were voided and stakes refunded.</div>`
    :ft?`<div class="muted small" style="font-weight:700">Full time — ${m.hs}–${m.as}</div>`
    :fin?`<div class="muted small" style="font-weight:700">Final — ${m.hs}–${m.as}</div>`

      ${oddsBtn(m,resLabel,{n:m.away,odds:m.odds.a})}

function sportNavHTML(active){
  const chips=[["Home","🏠","#/home"],["Live "+liveCountNow(),"📺","#/live"],["Soccer","⚽","#/football"],["Tennis","🎾","#/live?sport=Tennis"],["Basketball","🏀","#/live?sport=Basketball"]];

function liveMeta(m){ // short live label for search results — never a minute for tennis
  if(m.sport==="Tennis") return "🔴 Live · Set "+(tennisNow(m).sets.length+1);
  if(m.sport==="Basketball") return "🔴 Live · "+bbLabel(m);
